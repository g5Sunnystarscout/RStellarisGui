 unga_nam_body:0 "The Movement refuses permanent alliances and sells its abstentions to whoever bids highest."
 unga_nam_log:0 "Session 1: the Movement refused a permanent alliance.\nSession 1: eleven delegations abstained.\nSession 2: talks with the host continued.\nSession 2: the caucus sold its abstention to the highest bidder.\nSession 3: four delegations left the caucus for the Union.\nSession 3: the Movement demanded a lifting of orbital tolls.\nSession 4: the caucus abstained again, for a price."
