 unga_news_wire:0 "DAY 12  The Assembly opens in New York. [Root.GetName] takes the chair.\nDAY 11  The treaty organization tables a motion on lunar basing rights.\nDAY 11  Atlantic members confirm a joint orbital patrol for the coming quarter.\nDAY 10  The non-aligned caucus abstains on the demilitarisation vote.\nDAY 09  The Union requests a permanent seat on the security committee.\nDAY 08  The Pacific charter announces a new deep-space tracking array.\nDAY 07  Two delegations withdraw their amendments to the lunar convention.\nDAY 06  The Assembly adjourns for the weekend. The floor reopens on Day 05."
