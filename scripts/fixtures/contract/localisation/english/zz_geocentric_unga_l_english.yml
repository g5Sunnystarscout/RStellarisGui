 unga_nato_body:0 "The Atlantic council coordinates the orbital forces of its members. Its votes in the Assembly are cast as a bloc."
 unga_nato_log:0 "Session 1: the council approved a joint orbital patrol.\nSession 1: two member states delayed their contribution.\nSession 2: the bloc voted with us on the climate fund.\nSession 2: no new commitments were tabled.\nSession 3: the council reopened the basing question.\nSession 3: two delegations requested a delay.\nSession 4: the bloc abstained on recognition."
