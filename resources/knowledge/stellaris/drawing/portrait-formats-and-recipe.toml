id = "portrait-formats-and-recipe"

title = "Stellaris portraits are not Live2D - they are 2D art on flat planes in a Maya skeleton, and here is how to add or bake one"

category = "drawing"

summary = "The \"Live2D-looking\" portrait is a 3D entity, not a Live2D/Cubism model. A 31,020,718,441-byte byte-scan of the whole install plus stellaris.exe finds zero moc3/Cubism/Live2D markers, and every one of 496 vanilla portrait definitions takes the `entity` route into gfx/models/portraits (406 .mesh + 1204 .anim + 3211 .dds). `portraitType` is a render-target viewport with 21 blocks, not a texture. A static 2D portrait needs no .gfx/.mesh/.asset at all, and an enabled workshop mod on this machine proves that minimal set. Measured in game: a 2D portrait renders through either `texturefile` or `spriteType`, but it CANNOT be animated - an overlay `animation = { }` is not played in a portrait slot (proved against a still-`spriteType` control), a portrait cannot name a `frameAnimatedSpriteType` (refused at load, portraits.cpp:929), and motion therefore means the .mesh pipeline, i.e. a Maya re-rig. A BanG Dream-style animated 2D portrait is not achievable by any route a mod can reach."

file_types = [
    ".txt",
    ".asset",
    ".gfx",
    ".mesh",
    ".anim",
    ".dds",
    ".shader",
    ".gui"
]

