    "binary: stellaris.exe (46,418,552 bytes) scanned byte-wise, case-insensitively, for moc3, model3.json, motion3.json, physics3.json, cdi3.json, cubism, live2d, live2dcubismcore, cubismmoc, cubismrenderer: 0 occurrences of every one. Only l2d (4, all inside OpenGL symbol names glVertexAttribL2D...) and moc (37, arbitrary binary) hit, deliberately included as noise controls.",
    "measured, the whole verified install: 42,860 files, 31,020,718,441 bytes, 0 read errors. moc3 14 occurrences in 14 files; model3.json, motion3.json, physics3.json, cdi3.json, cubism, live2d, live2dcubismcore, cubismmoc, cubismrenderer all 0. The 14 moc3 files are dlc/dlc036_biogenesis/dlc036.zip, 12 .dds textures, music/cradleofthegalaxy.ogg, 3 .flac, 2 .mp3, 2 .wav - all entropy-coded, a single 4-byte coincidence each.",
    "measured, the enabled workshop mods: 22,732 files, 8,402,814,252 bytes, live2d 0, cubism 0, model3.json 0, moc3 6 (all inside .png/.dds/.ogg payloads).",
    "measured, the install by FILENAME: 0 files match .moc, .moc3, .cmo3, model3.json, motion3.json, physics3.json, cdi3.json, cubism or live2d.",
    "measured: gfx/models/portraits/ = 3211 .dds, 1204 .anim, 406 .mesh, 81 .asset, 44 .gfx, 2 .swatch. gfx/portraits/ = 584 .dds, 211 .txt, 2 .tga.",
    "measured: gfx/portraits/portraits/**/*.txt = 41 files, 39 top-level portraits = { blocks, 496 definitions - 105 write the opening brace on its own line and 391 write their fields on the opening line. The route split is 83 entity-only + 413 entity + character_textures, 0 texture-only. 456 entity names are defined across the 81 .asset files.",
    "vanilla: gfx/models/portraits/human/_human_portrait_meshes.gfx:9-17 is the verbatim pdxmesh shape; _human_portrait_entities.asset:8-19 the entity + state shape (chance = 3.0 / 1.0, next_state = idle); _human_portrait_animations.asset:6-9 the animation shape.",
    "vanilla: gfx/portraits/portraits/00_portraits_main.txt:14-231 defines the six layout blocks character, character_large, room, empty_room, character_without_room, planet - exactly the six values portraitType.type takes, which is what makes portraitType a layout selector rather than a picture.",
    "vanilla: gfx/portraits/portraits/00_portraits_main.txt:236-243 is the install's own #OR documentation of the spriteType / texturefile / entity routes.",
    "vanilla: interface/core.gfx holds 18 of the 21 portraitType blocks (the other three at interface/diplomacy_view.gfx:741, interface/first_contact_view.gfx:212, interface/galaxy_view.gfx:463); field census effectFile x21 (buttonstate_rendertarget.shader x20, buttonstate_rendertarget_hologram.shader x1), type x21, character x21, masking_texture x15, texturefile x11 (all gfx/interface/main/unselected_portrait.dds).",
    "vanilla: the 5 frameAnimatedSpriteType blocks are interface/main.gfx:598, interface/mapicons.gfx:3, :430, :439, interface/ship_designer.gfx:90; field census noOfFrames (21 x3, 10 x2), animation_rate_fps (20 x3, 8, 10), looping yes x5, play_on_show yes x5, no effectFile in any of the five. Textures measured 1470x47, 1470x47, 1470x47, 640x47, 340x34, all RGBA32 with mipCount = 1.",
    "measured: interface/**/*.gfx (131 files) block counts spriteType 8616, corneredTileSpriteType 335, progressbarType 195, portraitType 21, flagSpriteType 18, frameAnimatedSpriteType 5, textSpriteType 4, pieChartType 3; animatedSpriteType and maskedShieldType 0.",
    "measured: 1128 noOfFrames > 1 declarations in interface/; 1103 divide integrally, 23 do not** (GFX_arrow_left 43x27 / 3, 107x57 / 2, 544x42 / 3, 259x32 / 8, 129x16 / 8, 47x15 / 3, 75x40 / 2). Histogram 3 x693, 2 x278, 5 x43, 4 x35, 16 x20, ..., 128 x1.",
    "measured: 632 overlay animation = { } blocks, every one a child of a spriteType; animationtype scrolling x486 / pulsing x85 / rotating x57 / rotating_ccw x2 / rotating_cw x2, animationblendmode overlay x424 / add x202, animationtime from 1 to 100.0.",
    "measured, the texture envelope: 3211 portrait .dds, 0 unreadable - BC3 2457, RGBA32 727, BC1 26, RGBA24 1; mipCount 1 x2486, 9 x344, 10 x293, 8 x62; power-of-two on neither side 1261; square 1706 / non-square 1505; commonest sizes 512x512 (1156), 500x500 (315), 320x400 (161), 300x360 (126), 1024x1024 (121), 420x512 (96), 532x480 (56).",
    "measured: .mesh and .anim share the container header 4040624021 08 7064786173736574 69 02 000000 01 = @@b@! + length 08 + ASCII pdxasset + \\x02; human_female_01_portrait.mesh is 105,423 bytes and carries readable object names ([object.[[Human_femal...), and the .anim files carry an [info. chunk with fps.",
    "measured: no .ma, .mb, .fbx, .obj, .dae, .blend, .psd, .xcf, .clip or .kra file ships (all 0). The authoring tool is named only by residue: 5 .mayaSwatches directories and .swatch files whose header reads AUTH erick.ramirez on PDX-FW0YJF3 / DATE Tue Jan 23 15:41:32 2024; plus 100 .animsm (text, UTF-8 with BOM) and 100 .editordata under gfx/animation_state_machines/.",
    "vanilla: the six portrait shader names come from gfx/models/portraits/**/*.gfx (174 shader = lines) and are Effect blocks in the plain-text gfx/FX/pdxmesh.shader (121,636 bytes); gfx/FX/buttonstate_rendertarget.shader (2,425 bytes) is a tex2D blit with @ifdef MASKING and contains no animation. gfx/FX/ holds 53 .shader and 23 .fxh files install-wide.",
    "vanilla: interface/planet_view.gfx:708-710 is the ONE shared pop icon - spriteType { name = \"GFX_pop\" textureFile = \"gfx/interface/icons/pop.dds\" } - drawn at interface/planet_view.gui:675-676, and 0 files in the install have popicon/pop_icon in the name.",
    "vanilla: interface/portraits/leaders.gfx declares GFX_leader_bg_commander / _admiral / _general / _scientist / _envoy / _spy / _engineering / _society / _physics over the 15 static gfx/portraits/leaders/leader_*_bg.dds plates.",
    "vanilla: per-portrait localisation exists for every portrait ID - localisation/english/main_3_l_english.yml:2524 mam5:0 \"Slender Mammalian 05\", :2537 human_female_01:0 \"Humanoid Mammalian 01\".",
    "vanilla: field-name correction for the wiki - attachment_selector occurs 497 times under gfx/portraits/portraits/, hair_selector 0. The engine agrees and says so out loud: mod portrait files on this machine that use the wiki's spelling draw portraits.cpp:963: Error: \"Unexpected token: hair_selector, near line: N\" once per occurrence (one file, ~64 occurrences, in the round-3 log). So the wiki field name is not merely unused in vanilla - it is rejected and logged.",
    "【目视 + 对照】 measured in a running game (4.4.6, -debug_mode, 2026-10-06), the user's own eyes against a deliberately built control: four colour-coded portraits in the empire designer's Humanoid list - A texturefile, B spriteType + animationtype = \"scrolling\", C spriteType + animationtype = \"pulsing\", D spriteType with no animation block - were all four visible and none animated: \"4个倒是都看见了，可是不动\", then \"都不动。有图案\". D is the separator and it rendered its art (yellow, its own pattern, not blank and not the placeholder), so the spriteType portrait route reaches a portrait slot while the overlay animation = { } is not played in it. Nothing here was seen by the project itself: synthetic input to the game window does not work on this machine, so the pixels are the user's and this is the only non-file evidence in the topic.",
    "measured (the logs of the same round, kept separate from the screen): portraits.cpp:929 was the round's only portrait-database line naming the probe, and it names the deliberate diagnostic key zz_probe_zz_marker_missing_sprite (which points at GFX_zz_probe_does_not_exist). The same validator says nothing about A/B/C/D, and run 1 of the same probe showed it *does* reject a bad portrait-side field - it refused zz_probe_d_frames naming a frameAnimatedSpriteType. So all four are registered, and a portrait naming a frameAnimatedSpriteType is refused by name.",
    "measured, the same probe rounds: a common/portrait_sets entry that lists portrait ids directly works - all four ids in the set appeared in the Humanoid list. An entry resolving to a portrait_groups key contributes only that group's default, which is exactly why the previous round showed a single still entry: the set named the group zz_probe_group, whose default was the one plain texturefile portrait. The group key itself is legal and logs nothing.",
    "measured, the engine's own verdict on the wiki's species-class route: persistent.cpp:41: Error: \"Unexpected token: portraits, near line: 5\" in file: \"common/species_classes/zz_probe_species_classes.txt\", the same error for common/species_classes/00_mygo_species_classes.txt (line 23) and ten times for common/species_classes/FW_spcs_karyl.txt. Neither of the install's 2 common/species_classes/*.txt files declares portraits (0 hits). The key is dead in 4.4.6.",
    "measured, the name-list encoding: the install's 76 common/name_lists/*.txt files all start with the UTF-8 BOM EF BB BF (0 without), and the engine warns when one does not - lexer.cpp:275: File 'common/name_lists/ZZ_PROBE.txt' should be in utf8-bom encoding (will try to use it anyways), which appeared in the run where the probe's own name list had no BOM and disappeared in the next run once the BOM was added. Other mods on this machine that ship BOM-less name lists (CHN1.txt, HUAXIA.txt) are warned about on every launch. It is a warning and the file is still read.",
    "measured, the minimal working mod (enabled in dlc_load.json on this machine, workshop id 3127301188): 8 non-texture files + 68 .dds, and no .gfx, no .mesh, no .asset, no .anim, no .gui at all. Its gfx/portraits/portraits/00_mygo_portraits.txt:1 is portraits = { POP_Anon = { texturefile = \"gfx/models/portraits/POP1.dds\" } ... } and :64 is the portrait_groups block.",
    "web: the Stellaris Wiki's Portrait modding states the mechanism - *\"Portraits in Stellaris are animated 2D characters. It works by having body parts split up on a texture map, assigning each body part to an individual polygonal plane, sorting them correctly in Maya and animating them using the skeleton feature.\"* - and names Autodesk Maya 2015/2016 plus Paradox's Clausewitz Maya Exporter (Maya exporter), a 512x512 DXT5 export, and the PdxMeshPortrait / PdxMeshPortraitClothes / PdxMeshPortraitHair shaders. This is web evidence, NOT a measurement taken here, and the page's banner says it was last verified for 3.3, three minor versions before this install."
]

rules = [
    "A portrait is DEFINED in gfx/portraits/portraits/*.txt, not in common/portraits/ - that directory does not exist in 4.4.6. common/portrait_categories/ and common/portrait_sets/ only LIST group names for the empire editor.",
    "A definition needs one of entity, texturefile, spriteType. Vanilla uses entity 496 times out of 496; texturefile is the mod route and needs no .gfx at all.",
    "A 2D portrait renders but does not move. Both texturefile and spriteType put a picture in a portrait slot; neither animates. Do not ship a spriteType with an overlay animation = { } expecting motion in a portrait - it is drawn still (measured on screen against a control), and the block buys nothing there. Motion means the .mesh pipeline.",
    "A portrait cannot name a frameAnimatedSpriteType. The engine refuses the definition by name at load (portraits.cpp:929) and there is no complaint about the sprite itself, so it is the portrait-side reference that is rejected, not the sprite kind.",
    "A common/portrait_sets entry may be a portrait id or a portrait_groups key. Listing ids directly yields every id (measured: all four appeared). A portrait_groups key contributes only that group's default - one portrait - and logs nothing, so a short list is not an error.",
    "Do not write a portraits key in common/species_classes/. The 4.4.6 parser rejects it (Unexpected token: portraits), neither of the install's two species-class files has one, and the list is filled by common/portrait_sets/ + common/portrait_categories/. The wiki and most community recipes still show it.",
    "A common/name_lists/*.txt should carry a UTF-8 BOM, like all 76 vanilla ones; without it the engine warns (lexer.cpp:275) and reads the file anyway.",
    "portraitType is a render-target viewport, not a picture. Do not add a texture to it expecting to change the portrait; type selects a layout block from 00_portraits_main.txt and texturefile is the \"unselected\" placeholder.",
    "spriteType + noOfFrames is a STATE STRIP, not an animation: the engine draws frame 0. Only frameAnimatedSpriteType animates frames.",
    "A frame strip must be a horizontal strip with textureWidth / noOfFrames an integer, and vanilla's are RGBA32 with one mip.",
    "Portrait textures are not required to be powers of two; 1261 of 3211 are not, and 500x500 is the second most common size in the install.",
    "~~A mod's common/species_classes entry must be the EXTENDABLE partial form (HUM = { portraits = { ... } }).~~ Disproved 2026-10-06: the portraits key is dead in 4.4.6 and the parser rejects it. See the rule above.",
    "attachment_selector, not the wiki's hair_selector (497 vs 0 occurrences). The wiki was last verified for 3.3; check every field name against the install.",
    "A portrait whose entity no .asset defines draws nothing and logs nothing. This is what portrait-entity-undefined (error) exists for, and a character_textures path in no indexed root is portrait-character-texture-missing (warning).",
    "Shaders under gfx/FX/ are text and a mod may override one at the same relative path. The renderer, the skeleton evaluation and the state machine are not reachable from gfx/.",
    "Do not expect Live2D semantics. There is no parameter, no blend weight and no layer parallax; the engine picks between pre-baked clips by weight and plays them."
]

breaks = [
    "105 portrait definitions was wrong, and the cross-check agreed with it. A census whose opener pattern was ^\\s*(\\w+)\\s*=\\s*\\{\\s*$ requires the brace to end the line, and vanilla writes 391 of its 496 definitions with the fields on the opening line. The same script counted the definitions a second way with the same pattern, so the two counts agreed on the wrong number. An independent brace-depth walk that allows trailing content gives 496. A cross-check only falsifies a method if it does not share the method's blind spot.",
    "A line scanner that takes \"the rest of the line\" as a field value produced 15 phantom errors on a clean install. With the opener above, an entity = \"portrait_robot_01_entity\" clothes_selector = ... line yielded the entity name portrait_robot_01_entity\"\\tclothes_selector = \"no_texture\"..., which of course matched no .asset, so portrait-entity-undefined fired 15 times against vanilla. The fix is a token reader that takes the QUOTED token, and a test asserts the entity is exactly portrait_mammalian_05_entity.",
    "spriteType + noOfFrames is not an animation. It looks like one - one field, a strip of N frames - and the engine draws frame 0. Treating the strip as a movie, or the texture's full width as the drawn width, is how the same sprite ends up reported up to noOfFrames times too wide (the defect src/lib/layout.mjs records for GFX_main_close_button: 114x38 reported instead of 38x38).",
    "common/portraits/ does not exist in 4.4.6. It is the natural name to guess, and a rule or a recipe written against it finds nothing rather than erroring. The real paths are gfx/portraits/portraits/ (definitions), common/portrait_sets/ and common/portrait_categories/ (editor listings).",
    "The wiki's hair_selector is stale. The install has attachment_selector 497 times and hair_selector 0 times. A recipe copied field-for-field from the Portrait modding page (last verified 3.3) puts the field name in the wrong place.",
    "buttonstate_rendertarget.shader is not where the life is. Reading portraitType's effectFile suggests the shader animates the portrait; the shader is a tex2D blit with an optional alpha mask. The motion is in the .anim clips the entity's state list selects between."
]

