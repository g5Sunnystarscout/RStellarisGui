body = """
## The answer in one line\n\nThe portraits that look like Live2D are **not Live2D and contain no Cubism**: they are ordinary 2D\nillustrations cut into body parts, each part mapped onto its own flat polygon plane in a 3D mesh,\nsorted back-to-front, and moved by a Maya **skeleton** whose keyframes the engine plays back. The\n\"2D that moves\" impression is real; the technology is a 3D rig, and **zero** Live2D/Cubism markers\nexist anywhere in the install or in `stellaris.exe`.\n\n**And a 2D portrait cannot be animated by any route a mod can reach.** That was measured in a\nrunning game, not inferred: a portrait **can** be a static `texturefile`, and it **can** be named\nthrough a `spriteType` - it **renders either way** - but the `spriteType`'s overlay\n`animation = { }` block is **not played** in a portrait slot, and a portrait **cannot** name a\n`frameAnimatedSpriteType` at all (the engine rejects it by name, `portraits.cpp:929`). Motion in a\nportrait means the `.mesh` pipeline - a Maya re-rig - so a BanG Dream-style animated 2D portrait is\n**not achievable**. See **The closed negative**.\n\n## The closed negative: it renders, and it does not move\n\nThis is the answer to the question that started the topic, and it was **measured in a running\ngame**, not derived from the files. A probe mod put four colour-coded portraits into the Humanoid\nlist of the empire designer (`创建帝国` -> `物种及肖像`), one per candidate mechanism:\n\n| entry | portrait definition | designed motion |\n| --- | --- | --- |\n| A **RED** | `texturefile` (plain static 2D, the control) | none, ever |\n| B **GREEN** | `spriteType` + overlay `animationtype = \"scrolling\"` | overlay sweeps, 2 s loop |\n| C **BLUE** | `spriteType` + overlay `animationtype = \"pulsing\"` | overlay breathes |\n| D **YELLOW** | `spriteType` with **no `animation` block at all** (the separator) | none |\n\nAll four entries were **visible**, and **none** of them moved. In the user's own words:\n**\"4个倒是都看见了，可是不动\"** and then **\"都不动。有图案\"** - all four are there, none animates,\nand the yellow one **shows its pattern**.\n\nD is what makes this a **clean negative rather than an absence**, and it is why the probe shipped a\nstill `spriteType` on purpose. D names a `spriteType`, and D **rendered its art**: not blank, not a\nplaceholder, not a missing texture. So the **`spriteType` portrait route does reach a portrait\nslot**. B and C ship the same art through the same route with a working `animation = { }` block\nappended, and they are **exactly as still as D**. The difference between D and B/C is the animation\nblock, and the difference produces no pixels on screen.\n\nTherefore: **the animation step is not executed for a portrait slot.** This is not \"the file did\nnot load\", not \"the portrait was not registered\", and not \"nothing was drawn\" - those three are\neach separately excluded (the log validated all four keys, and D drew its art). What is excluded is\nspecifically the overlay's UV motion.\n\nThe two supporting facts, both from the engine's log rather than from the screen:\n\n* A portrait **cannot** name a `frameAnimatedSpriteType` - the only frame animator the engine has.\n  `portraits.cpp:929: Invalid portrait configuration specified for \"zz_probe_d_frames\"`, with no\n  complaint about the sprite itself, so the sprite kind registers and the **portrait-side name** is\n  what is refused.\n* All four working definitions **pass** the same validator: the log's only `portraits.cpp:929` line\n  is for a deliberate diagnostic key naming a nonexistent sprite, and the validator says nothing\n  about A/B/C/D. So the silence about them is evidence, not absence of evidence.\n\nThe two routes reach a portrait, and neither of them moves:\n\n| route | renders in a portrait slot? | animates there? |\n| --- | --- | --- |\n| `texturefile = \"gfx/models/portraits/x.dds\"` | **yes** (A, and the enabled workshop mod on this machine) | **no** - it is a still by definition |\n| `spriteType = \"GFX_x\"` | **yes** (D) | **no** - the overlay `animation = { }` is not played (B, C) |\n| portrait names a `frameAnimatedSpriteType` | n/a | **no** - rejected at load, `portraits.cpp:929` |\n| `entity = \"...\"` -> `pdxmesh` -> `.mesh` + `.anim` | **yes** | **yes** - this is the only one |\n\n**Provenance, kept separate on purpose.** The \"none of the four animates\" observation is the\nuser's own eyes against a deliberately built control - **【目视 + 对照】** - and it is the only\nevidence for the animation half; nothing here was seen by this project, and synthetic input to the\ngame's window does not work on this machine. The registration and validation facts (A/B/C/D pass\n`CPortraitDatabase`, the `frameAnimatedSpriteType` variant is refused) are the **log's**. The files\nand the counts elsewhere in this topic are measurements of the install.\n\n## The decisive negative: no Live2D, no Cubism, anywhere\n\nSix needles that any Cubism runtime or model would have to carry, byte-scanned\ncase-insensitively over every file of the install and over the executable:\n\n| needle | install (42,860 files, 31,020,718,441 bytes) | `stellaris.exe` (46,418,552 bytes) | workshop mods (22,732 files, 8,402,814,252 bytes) |\n| --- | --- | --- | --- |\n| `moc3` | 14 occurrences in 14 files | 0 | 6 occurrences in 6 files |\n| `model3.json` | **0** | **0** | **0** |\n| `motion3.json` | **0** | **0** | **0** |\n| `physics3.json` | **0** | **0** | **0** |\n| `cdi3.json` | **0** | **0** | **0** |\n| `cubism` | **0** | **0** | **0** |\n| `live2d` | **0** | **0** | **0** |\n| `live2dcubismcore` | **0** | **0** | **0** |\n| `cubismmoc` | **0** | **0** | **0** |\n| `cubismrenderer` | **0** | **0** | **0** |\n\nAll 20 `moc3` hits are **single coincidental byte runs inside entropy-coded containers** - a DLC\n`.zip`, twelve `.dds` textures, three `.ogg`/`.mp3`/`.flac` tracks, two `.wav` samples, and six\n`.png`/`.dds`/`.ogg` files in mods. A four-byte ASCII needle in 31 GB of compressed and audio data\nis expected to appear some dozens of times by chance; none of the hits sits in a file with a\nCubism name, and no file in the install has a `.moc`, `.moc3`, `.cmo3`, `.model3.json`,\n`.motion3.json`, `.physics3.json` or `.cdi3.json` name (checked separately by filename, all zero).\nThe exe's only `l2d` hits are inside OpenGL symbol names (`glVertexAttribL2D...`), and its `moc`\nhits are arbitrary binary.\n\nSo: **Live2D/Cubism is not involved at all**, and no mod on this machine has ever shipped one\neither. The resemblance is convergent, not shared technology.\n\n## What the portraits actually are\n\n`gfx/models/portraits/**` is the home of the artwork. Measured:\n\n| extension | files | what it is |\n| --- | --- | --- |\n| `.dds` | 3211 | the textures painted on the mesh (body, clothes, hair, iris, pupil) |\n| `.anim` | 1204 | skeletal keyframe animation, in Paradox's own `pdxasset` container |\n| `.mesh` | 406 | the flat polygon planes, same container |\n| `.asset` | 81 | `entity = { ... }` and `animation = { ... }` definitions |\n| `.gfx` | 44 | `objectTypes = { pdxmesh = { ... } }` - mesh name to file to animation ids |\n| `.swatch` | 2 | Autodesk **Maya** swatch residue (see below) |\n\n`gfx/portraits/**` (a *different* tree, easily confused) holds 584 `.dds` and 211 `.txt`; of those,\n`gfx/portraits/portraits/*.txt` is the file that **defines a portrait**, and\n`gfx/portraits/leaders/*.dds` are 15 static leader background plates.\n\n### The pipeline, concretely\n\n```\ngfx/portraits/portraits/01_portraits_mammalian.txt      <- a portrait ID is DEFINED here\n    portraits = { mam5 = { entity = \"portrait_mammalian_05_entity\" ... } }\n\ngfx/models/portraits/mammalian/_..._portrait_entities.asset       <- entity -> mesh + states\n    entity  = { name = \"portrait_mammalian_05_entity\"\n                pdxmesh = \"portrait_mammalian_05_mesh\"\n                default_state = \"idle\"\n                state = { name = \"idle\" animation = \"idle\" animation_blend_time = 0.45\n                          chance = 3.0 looping = no next_state = idle }\n                scale = @mammalianscale }\n\ngfx/models/portraits/mammalian/_..._portrait_meshes.gfx           <- mesh -> .mesh + .anim ids\n    objectTypes = { pdxmesh = { name = \"portrait_mammalian_05_mesh\"\n                                file = \"gfx/models/portraits/mammalian/....mesh\"\n                                animation = { id = \"idle\" type = \"mammalian_05_happy_animation\" }\n                                scale = 1.0 } }\n\ngfx/models/portraits/mammalian/_..._portrait_animations.asset     <- animation id -> .anim file\n    animation = { name = \"mammalian_05_happy_animation\"\n                  file = \"mammalian_05_portrait_happy.anim\" }\n```\n\nFour files carry one portrait's motion, and the portrait's own definition is a fifth. This is the\nverbatim shape of `_human_portrait_meshes.gfx:9-17`, `_human_portrait_entities.asset:8-19` and\n`_human_portrait_animations.asset:6-9`.\n\n### The `.mesh` and `.anim` file formats\n\nBoth are Paradox's own binary container, and both begin with the same 20 bytes:\n\n```\nhex   4040624021 08 7064786173736574 69 02 000000 01\nascii @@b@!         .  p d x a s s e t   i  .\n```\n\ni.e. a `@@b@!` magic, a length byte `08`, the literal ASCII string **`pdxasset`**, then `\\x02` and a\nversion word. `human_female_01_portrait.mesh` is 105,423 bytes and its header continues with\nreadable object names (`[object.[[Human_femal...`); the `.anim` files carry an `[info.` chunk with\nan `fps` field. Neither format has a specification in the install and no exporter ships with it -\nsee **How the artwork is actually made**.\n\n### Which shader draws a portrait\n\nPortrait meshes name one of six shaders, all **text** files, in `gfx/models/portraits/**/*.gfx`\n(174 `shader =` lines there):\n\n`PdxMeshPortrait`, `PdxMeshPortraitAnimateUV`, `PdxMeshPortraitClothes`, `PdxMeshPortraitHair`,\n`PdxMeshPortraitCustomDiffuseAnimateUV`, `PdxMeshAlphaAdditiveAnimateUV`.\n\nThey are `Effect` blocks in `gfx/FX/pdxmesh.shader` (121,636 bytes of plain HLSL, with `@ifdef`\nvariants and `.fxh` includes) - the install ships 53 `.shader` and 23 `.fxh` files under `gfx/FX/`.\nA mod **can** ship its own copy at the same relative path, because a shader is text and the engine\nreads the last `dlc_load.json` entry per relative path. What a mod cannot do is reimplement the\nrenderer: the portrait is drawn by the engine into a render target, and the shader is the blit.\n\n## The two `.gfx` kinds, censused\n\n`portraitType` and `frameAnimatedSpriteType` are the two kinds people reach for, and they are\n**completely different mechanisms**.\n\n### `portraitType` - 21 blocks, a render-target VIEWPORT, not a texture\n\nAll 21 live in `interface/core.gfx` (18), `interface/diplomacy_view.gfx:741`,\n`interface/first_contact_view.gfx:212` and `interface/galaxy_view.gfx:463`. Field census:\n\n| field | count | values |\n| --- | --- | --- |\n| `name` | 21 | `GFX_portrait_character`, `GFX_portrait_room`, ... |\n| `effectFile` | 21 | `gfx/FX/buttonstate_rendertarget.shader` x20, `gfx/FX/buttonstate_rendertarget_hologram.shader` x1 |\n| `type` | 21 | `character` x9, `room` x3, `planet` x3, `empty_room` x2, `character_without_room` x2, `character_large` x2 |\n| `character` | 21 | `yes` x17, `no` x4 |\n| `masking_texture` | 15 | `gfx/interface/leaders/portrait_mask_fade.dds` x4, `..._fade_bottom.dds`, `overlord_portrait_mask.dds` x3, `diplomacy_portrait_mask.dds` x3, ... |\n| `texturefile` | 11 | `gfx/interface/main/unselected_portrait.dds` x11 (**only** this placeholder) |\n| `alternate_configurations` (block) | 15 | `holographic` |\n| `mid_close_up` | 3 | `yes` |\n| `close_up` | 2 | `yes` |\n\nThree facts settle what it is:\n\n1. There is **no `size` field and no portrait texture**. The single `texturefile` value is\n   `unselected_portrait.dds`, the \"no portrait selected\" placeholder.\n2. `type` takes exactly the six values `character`, `character_large`, `room`, `empty_room`,\n   `character_without_room`, `planet` - and `gfx/portraits/portraits/00_portraits_main.txt`\n   defines exactly those six as **layout blocks** (`character = { size = { x = 575 y = 380 }\n   entity = { orientation = center_down position = { x = 0 y = -20 } scale = 24\n   default_close_up_scale = 2 } }`, ... `planet = { size = { x = 800 y = 400 } ... }`). So `type`\n   selects which layout the engine renders the portrait into.\n3. The shader is `buttonstate_rendertarget.shader`, whose whole pixel stage is\n   `float4 OutColor = tex2D( MapTexture, v.vTexCoord );` with an optional\n   `OutColor.a *= MaskColor.a;`. It **blits** a texture - the render target the engine already\n   drew the entity into - and can do nothing else. It contains no animation.\n\nA `.gui` places one by naming the sprite: `quadTextureSprite = \"GFX_portrait_character\"` (39\noccurrences) or `spriteType = \"GFX_portrait_character\"` (31), on containers named `portrait` (105),\n`character_portrait` (21), `portrait_window` (19), `portrait_container` (13), and friends. So\n**`portraitType` is the window, not the picture**. `close_up` / `mid_close_up` /\n`custom_close_up_scale` / `custom_close_up_position_offset` are all framing, not content.\n\n### `frameAnimatedSpriteType` - 5 blocks, frame-animated 2D, and NOT used for portraits\n\n| field | count | values |\n| --- | --- | --- |\n| `name` | 5 | see below |\n| `noOfFrames` | 5 | `21` x3, `10` x2 |\n| `animation_rate_fps` | 5 | `20` x3, `8` x1, `10` x1 |\n| `looping` | 5 | `yes` x5 |\n| `play_on_show` | 5 | `yes` x5 |\n| `texturefile` / `textureFile` | 3 / 2 | (both spellings in the same install) |\n| `transparencecheck` | 2 | `yes`, `no` |\n| `alwaystransparent` | 2 | `yes` x2 |\n\n**No `effectFile` and no shader in any of the five.** The five, with their measured textures:\n\n| block | frames | texture | frame width |\n| --- | --- | --- | --- |\n| `GFX_control_group_in_combat_flash` `interface/main.gfx:598` | 10 | 640x47 RGBA32, 1 mip | 64 |\n| `GFX_hover_indicator` `interface/mapicons.gfx:3` | 21 | 1470x47 RGBA32, 1 mip | 70 |\n| `GFX_map_icon_system_goto_has_intel` `interface/mapicons.gfx:430` | 21 | 1470x47 RGBA32, 1 mip | 70 |\n| `GFX_map_icon_system_goto_no_intel` `interface/mapicons.gfx:439` | 21 | 1470x47 RGBA32, 1 mip | 70 |\n| `GFX_ship_designer_slot_indicator` `interface/ship_designer.gfx:90` | 10 | 340x34 RGBA32, 1 mip | 34 |\n\nEvery one is a map icon, a ship-designer slot indicator or a control-group combat flash. **Vanilla\nuses `frameAnimatedSpriteType` for exactly zero portraits.** `animatedSpriteType` and\n`maskedShieldType` have **0** blocks in `interface/**`.\n\nFor context, the other counted kinds in `interface/**/*.gfx` (131 files): `spriteType` 8616,\n`corneredTileSpriteType` 335, `progressbarType` 195, `frameAnimatedSpriteType` 5,\n`textSpriteType` 4, `pieChartType` 3, `flagSpriteType` 18, `portraitType` 21.\n\n## The frame layout convention, derived rather than assumed\n\n`noOfFrames` appears **1128 times with a value greater than 1** in `interface/**/*.gfx`. The layout\nis a **horizontal strip**: frame *n* occupies `x = n * (textureWidth / noOfFrames)`, so the drawn\nsize of the sprite is `textureWidth / noOfFrames` by `textureHeight`. 1103 of the 1128 divide\nexactly (`GFX_main_close_button`: 114x38 with `noOfFrames = 3` -> 38x38;\n`GFX_hover_indicator`: 1470x47 with 21 -> 70x47). **23 do not**:\n\n```\nGFX_arrow_left                3 frames   43x27  -> 14.333…\nGFX_crisis_..._level_1_btn    2 frames  107x57  -> 53.5\nGFX_tab_2_inactive            3 frames  544x42  -> 181.333…\nGFX_gravity_snare_presence_icons 8 frames 259x32 -> 32.375\nGFX_text_ship_category_space_amoeba_rarity 8 frames 129x16 -> 16.125\n```\n\nFrame counts in use run from 2 to **128** (`3` x693, `2` x278, `5` x43, `4` x35, `16` x20, ...,\n`128` x1). The exact rounding rule for a non-integral strip is **not established** (see 待确认);\nthe project's own `src/lib/layout.mjs` (`drawnSpriteSize`) uses\n`Math.max(1, Math.round(textureWidth / frameCount))`, which is what the preview and the rect table\nboth draw.\n\n`spriteType` + `noOfFrames` **does not animate.** The engine draws frame 0 - the other frames are\nbutton *states* (normal / hover / pressed), which is why the same texture ships as a strip. A\nmulti-frame spriteType is a state set, not a movie.\n\n## The third 2D mechanism: the overlay `animation = { }` block\n\nA `spriteType` may carry an `animation = { ... }` block that scrolls, pulses or rotates a SECOND\ntexture over the sprite through a mask. **632** such blocks exist in `interface/**/*.gfx`, all\ninside a `spriteType`:\n\n| field | count | values |\n| --- | --- | --- |\n| `animationlooping` | 632 | `yes` x624, `no` x8 |\n| `animationtime` | 632 | `12.0` x269, `2.0` x67, `1` x32, `20.0` x30, `100.0` x30, ... |\n| `animationtype` | 632 | `scrolling` x486, `pulsing` x85, `rotating` x57, `rotating_ccw` x2, `rotating_cw` x2 |\n| `animationmaskfile` | 631 | `gfx/interface/fleet_view/fleet_task_button_mask.dds` x135, ... |\n| `animationtexturefile` | 631 | `gfx/interface/fleet_view/action_button_texture.dds` x135, ... |\n| `animationblendmode` | 626 | `overlay` x424, `add` x202 |\n| `animationdelay` | 624 | `0.0` x491, `0` x95, `4.75` x25, ... |\n| `animationrotation` | 623 | `180.0` x420, `90.0` x124, `-90.0` x57, ... |\n\n`animationrotationoffset`, `animationtexturescale` and `animationframes` also occur, as blocks\n(`interface/common_portrait_component.gfx:33-45`).\n\nThe census proves the mechanism **exists and is used 632 times**; it does **not** say where it is\nhonoured. Two things are now measured about that. No vanilla portrait definition uses it - vanilla\nhas zero such blocks in a portrait context at all, which is why nothing in the install contradicted\nthe plausible reading. And the probe's green and blue entries are **still on screen** while carrying\na working block each (**The closed negative**). So the overlay is a real, widely used effect on\n**ordinary GUI sprites and buttons**, and it is **not executed when the sprite is used as a\nportrait**.\n\n## The three pipelines, kept apart\n\nThey are **not** the same mechanism.\n\n| | (a) species portrait in the empire / species screen | (b) leader / advisor / envoy portrait | (c) small static thumbnail |\n| --- | --- | --- | --- |\n| source of the picture | `portraits` definition -> `entity` -> `pdxmesh` -> `.mesh` + `.anim` + `character_textures` | **the same** entity pipeline, plus 15 static `gfx/portraits/leaders/leader_*_bg.dds` plates behind it | one shared static `spriteType` |\n| moves? | skeletal animation, chance-weighted idle states | the same, and the advisor adds a greeting sound | **no** |\n| shown through | `portraitType` `GFX_portrait_character` / `..._close_up` / `..._character_large` | `GFX_portrait_character_close_up`, `..._mid_close_up`, `..._faded`, `..._hologram` | `spriteType = \"GFX_pop\"` |\n| vanilla example | `mam5` -> `portrait_mammalian_05_entity` (`01_portraits_mammalian.txt:75`) | `advisor_entity` -> `advisor_mesh` + 4 anims (`gfx/models/portraits/advisor/advisor_entity.asset:1-14`) | `interface/planet_view.gfx:708` |\n\n**(c) is worth stating plainly**: all pops share ONE texture. `interface/planet_view.gfx:708-710`\nis `spriteType { name = \"GFX_pop\" textureFile = \"gfx/interface/icons/pop.dds\" }`, and\n`interface/planet_view.gui:675-676` draws it as `arkship_pops_icon`. There is no per-species pop\nicon, and **0** files in the install have `popicon`/`pop_icon` in the name. A pop thumbnail is not\na portrait at all.\n\n**(b) blinks because of the entity state machine**, not because of a blink asset. From\n`_human_portrait_entities.asset:12-17`:\n\n```\ndefault_state = \"idle\"\nstate = { name = \"idle\" animation = \"idle\"  animation_blend_time = 0.45 chance = 3.0 looping = no next_state = idle }\nstate = { name = \"idle\" animation = \"idle2\" animation_blend_time = 0.45 chance = 1.0 looping = no next_state = idle }\nstate = { name = \"sad\"  animation = \"sad\"   animation_blend_time = 0.45 chance = 3.0 looping = no next_state = sad }\n```\n\n`chance` is a weight, so `idle` plays three times as often as `idle2`; `next_state` returns to the\nsame state, so the idle loops forever. That is the whole \"it is alive\" trick, and it is\n**randomised selection between pre-baked clips**, not a parameter-driven rig.\n\n## How the artwork is actually made\n\nTwo different crafts, and the install says which tool each needs.\n\n### Static 2D - no `.gfx`, no `.mesh`, no `.asset`\n\nA portrait definition may name a texture directly, and vanilla documents it in a comment at\n`gfx/portraits/portraits/00_portraits_main.txt:236-243`:\n\n```\n### mam1 = {\n###\t\tspriteType = \"GFX_portrait_mam1\"\n###\t\t#OR\n###\t\ttexturefile = \"gfx/interface/portraits/mammalien_massive_01.dds\"\n###\t\t#OR\n###\t\tentity = \"portrait_mammalian_06_entity\"\n###\t}\n```\n\nNo vanilla portrait uses the first two: all **496** definitions filter to\n83 `entity`-only + 413 `entity` + `character_textures`, and **0 with a `texturefile` and no\n`entity`**. Mods use them heavily. An enabled workshop mod on this machine\n(`3127301188`, BanG Dream \"MyGO\" portraits) is a complete, working minimal example:\n\n```\ndescriptor.mod\ngfx/portraits/portraits/00_mygo_portraits.txt    portraits = { POP_Anon = { texturefile = \"gfx/models/portraits/POP1.dds\" } ... }\n                                                 portrait_groups = { Mygo_and_AveMujica_Portraits = { default = POP_Anon  game_setup = { add = { portraits = { ... } } } ... } }\ncommon/portrait_sets/myg_portrait_sets.txt       mygo_humanoid = { species_class = HUM  portraits = { \"Mygo_and_AveMujica_Portraits\" ... } }\ncommon/portrait_categories/000_ms_portrait_cat.txt  humanoids = { name = HUM  sets = { mygo_humanoid } }\ncommon/species_classes/00_mygo_species_classes.txt  HUM = { portraits = { \"Mygo_and_AveMujica_Portraits\" ... } }\ncommon/name_lists/MYG1.txt\nlocalisation/simp_chinese/myg_l_simp_chinese.yml\ngfx/models/portraits/*.dds                       68 textures\n```\n\nThat is the whole file set: **no `.gfx`, no `.mesh`, no `.asset`, no `.anim`, no `.gui`.** Two\ncorrections to that file list, both measured in a running game rather than from the files:\n\n* The `common/species_classes` file must **not** be relied on. This mod ships\n  `HUM = { portraits = { ... } }`, and the 4.4.6 parser **rejects that key** -\n  `persistent.cpp:41: Error: \"Unexpected token: portraits, near line: 23\" in file:\n  \"common/species_classes/00_mygo_species_classes.txt\"` (also for `FW_spcs_karyl.txt`, ten times,\n  and for the probe's own copy). Neither of the install's **two** `common/species_classes/*.txt`\n  files declares `portraits` at all (0 hits). The key is **dead in 4.4.6**; the portrait list is\n  wired through `common/portrait_sets` + `common/portrait_categories` instead, and the mod still\n  works because of those two files. The wiki entry for this is stale, like its `hair_selector`.\n* The mod's `common/name_lists/MYG1.txt` should carry a **UTF-8 BOM**, like every one of the\n  install's own **76** name lists (`HUM1.txt`/`MAM1.txt` start `EF BB BF`). The engine accepts a\n  BOM-less one but says so: `lexer.cpp:275: File 'common/name_lists/ZZ_PROBE.txt' should be in\n  utf8-bom encoding (will try to use it anyways)`. It is a warning and not a fatal error - the file\n  is still read - but it is one line of log noise per BOM-less list, and third-party mods on this\n  machine that omit it (`CHN1.txt`, `HUAXIA.txt`) are warned about on every single launch.\n\n### Animated / \"3D-looking\" - a Maya rig, and no exporter in the install\n\nThe install's own residue names the tool: five `.mayaSwatches` directories\n(`gfx/models/portraits/cybernetics/.mayaSwatches`, `.../synthetics_machine/.mayaSwatches`,\n`gfx/models/ships/biogenesis_02`, `gfx/models/ships/mammalian_01`, `gfx/models/ui`), `.swatch`\nfiles whose header carries `AUTH erick.ramirez on PDX-FW0YJF3` and\n`DATE Tue Jan 23 15:41:32 2024`, plus 100 `.animsm` (Paradox animation state machines, **text**)\nand 100 `.editordata` files under `gfx/animation_state_machines/`. **No `.ma`, `.mb`, `.fbx`,\n`.obj`, `.dae`, `.blend`, `.psd`, `.xcf`, `.clip` or `.kra` file ships** (all measured 0), so no\nsource scene is available to learn the format from.\n\nThe community tooling is external to the install and is cited as such: the Stellaris Wiki's\n[Portrait modding](https://stellaris.paradoxwikis.com/Portrait_modding) page states the mechanism\nin one sentence - *\"Portraits in Stellaris are animated 2D characters. It works by having body\nparts split up on a texture map, assigning each body part to an individual polygonal plane,\nsorting them correctly in Maya and animating them using the skeleton feature.\"* The same page\nspecifies **Autodesk Maya 2015/2016** plus Paradox's **Clausewitz Maya Exporter**\n([Maya exporter](https://stellaris.paradoxwikis.com/Maya_exporter)), a Photoshop `.dds` (DXT5)\nexport resized to 512x512, the `PdxMeshPortrait` / `PdxMeshPortraitClothes` /\n`PdxMeshPortraitHair` shaders, and \"Skip Merge\" on export. **This is web evidence, not a\nmeasurement taken here**, and the page's own banner says it was last verified for 3.3 - one of its\nfield names is already wrong for 4.4.6 (it writes `hair_selector`; the install has\n`attachment_selector` **497** times and `hair_selector` **0** times). Treat the wiki's *shape* as\nsound and its *field names* as needing a check against the install.\n\n### The \"live\" effect, split three ways\n\n* **the model** (`.mesh`) decides *what* can move: which parts of the illustration are separate\n  planes and in what draw order. It is the illustration's layer structure, in 3D.\n* **the animation** (`.anim` + the `entity` `state` list) decides *how* it moves and *which* clip\n  plays, via `chance` weights and `next_state`.\n* **the shader** decides the surface treatment. `buttonstate_rendertarget.shader` is only the final\n  texture blit with `MASKING`; `PdxMeshPortraitClothes` / `...Hair` select texture sets, and\n  `PdxMeshPortraitAnimateUV` / `PdxMeshAlphaAdditiveAnimateUV` add UV scroll on a few meshes\n  (extradimensional, ep10, the Baol room). The shader cannot animate the portrait - it can only\n  scroll what is there.\n\nShaders are text and overridable, so the shader is **not** out of reach. The **renderer** is:\nthe engine draws the entity into a render target and the shader blits it; nothing in `gfx/` can\nchange how the skeleton is evaluated or when a state is picked.\n\n## Baking a Live2D-style animation into a frame strip\n\nIf the goal is a BanG Dream-style animated 2D portrait, the honest verdict is:\n**the engine has exactly one frame-animation primitive, and a portrait slot is not wired to it.**\nThe probe closed this on screen, and the mechanism is **not** \"the feature is missing\" - it is\n\"the feature exists and this slot does not run it\":\n\n1. **`spriteType` + `animation = { ... }`** - a masked overlay that scrolls/pulses/rotates with\n   `animationtime`, `animationblendmode` and `animationtype`, used 632 times in vanilla. A portrait\n   definition's documented `spriteType = \"GFX_...\"` route **does** render in a portrait slot (the\n   probe's yellow control proves it) but the overlay **is not played there** (its green and blue\n   entries are exactly as still as the control). It is the only make-a-still-picture-move facility\n   the engine has without a model, and it does not reach a portrait.\n2. **`frameAnimatedSpriteType`** - a real frame animator: `noOfFrames`, `animation_rate_fps`,\n   `looping`, `play_on_show`, `transparencecheck`, `alwaystransparent`. It animates on its own\n   once shown; no script and no state machine is needed. A portrait **cannot name one**: the\n   engine refuses it at load (`portraits.cpp:929`) - `portraitType` has no frame fields either.\n3. **`spriteType` + `noOfFrames`** - **does not animate**: frame 0 only. Useless as a movie.\n4. **A `.mesh` portrait** - the one route that genuinely animates a portrait slot, and closed for a\n   mod without Maya and the Clausewitz exporter (see above).\n\nTwo limits that follow, and they are the limits the question is really about:\n\n* **Frame-based animation is not parameter-driven.** There is no parameter, no pivot, no\n  blend weight and no input. A strip cannot react to state, cannot cross-fade, and cannot do\n  Live2D's parallax between layers. `animation_rate_fps` is a single fixed rate for the whole\n  loop; there is no per-frame timing and no frame event. Whatever the strip shows is what plays.\n* **The realistic ceiling is unknown.** The largest `noOfFrames` in the install is 128, the\n  largest frame-animated texture is 1470x47, and every `frameAnimatedSpriteType` texture is\n  **uncompressed RGBA32 with one mip**. Those are what vanilla ships, not a stated limit; nothing\n  in the install says where the engine refuses.\n\n**Licensing, stated once and not moralised**: the technique above is usable with your own art. A\ncommercial game's card art or character illustrations cannot be redistributed in a published mod -\nthat is a permission problem, not a technical one, and it is unaffected by everything else in this\ntopic.\n\n## The recipe\n\n### (a) A portrait from existing art - recolour or replace\n\n1. Put your art at `gfx/models/portraits/<name>.dds`, **512x512 or any size you like** (power of\n   two not required); DXT5/BC3 if it has alpha cut-out, DXT1/BC1 if it is opaque.\n2. In `gfx/portraits/portraits/zz_<mod>_portraits.txt`, inside `portraits = { ... }`:\n   `my_portrait = { texturefile = \"gfx/models/portraits/<name>.dds\" }`. **No `.gfx`, no `.asset`,\n   no `.mesh`, no localisation key are required.** To replace vanilla art instead, shadow the\n   vanilla path - 68 textures go in `gfx/models/portraits/` in the working example, and the\n   portrait ID keeps pointing at the same relative path.\n3. Add a `portrait_groups = { my_group = { default = my_portrait\n   game_setup = { add = { portraits = { my_portrait } } } species = { add = { portraits = { my_portrait } } }\n   pop = { add = { portraits = { my_portrait } } } leader = { add = { portraits = { my_portrait } } }\n   ruler = { add = { portraits = { my_portrait } } } } }` in the same file. The six scopes are\n   `default`, `game_setup`, `species`, `pop`, `leader`, `ruler`.\n4. List the group in `common/portrait_sets/zz_<mod>_sets.txt`:\n   `my_set = { species_class = HUM  portraits = { \"my_group\" } }`.\n5. List the set in `common/portrait_categories/zz_<mod>_categories.txt`:\n   `humanoids = { name = HUM  sets = { my_set } }`.\n6. **Do not rely on** a `portraits` key in `common/species_classes/`. It is refused by the 4.4.6\n   parser (see **Evidence**), and neither of the install's two species-class files uses it. The\n   community recipes and the working mod on this machine both ship it, which is what the wiki shows\n   - it costs a log error and does nothing. `common/portrait_sets/` + `common/portrait_categories/`\n   are the wires that actually fill the list.\n7. Optional: a localisation key per portrait ID (`my_portrait:0 \"My Portrait\"`) - vanilla has one\n   for every portrait (`localisation/english/main_3_l_english.yml:2524 mam5:0 \"Slender Mammalian\n   05\"`, `:2537 human_female_01:0 \"Humanoid Mammalian 01\"`), but the working example on this\n   machine ships none, so it is not in the minimal set.\n\n### (b) A portrait from your own artwork that MOVES\n\nPick the route that matches what you can produce:\n\n* **No 3D tool, static art only** -> steps (a) 1-7 and stop there. A portrait **does** render\n  through a `spriteType` that carries an overlay `animation = { }` - the probe's yellow control\n  proves the `spriteType` route reaches the slot - but it renders **still**: the overlay is **not\n  played in a portrait slot** (measured, the probe's green and blue entries). Registering a sprite\n  with an overlay animation and pointing a portrait at it therefore buys a static picture with\n  extra files, and **no motion**. The field shape is real and the block is honoured on ordinary\n  GUI sprites; it is simply not honoured here:\n  ```\n  # interface/zz_<mod>_portraits.gfx\n  spriteType = {\n      name = \"GFX_my_portrait\"\n      textureFile = \"gfx/models/portraits/<name>.dds\"\n      animation = {\n          animationtexturefile = \"gfx/models/portraits/<shine>.dds\"\n          animationmaskfile    = \"gfx/models/portraits/<mask>.dds\"\n          animationtype        = pulsing          # scrolling | pulsing | rotating | rotating_cw | rotating_ccw\n          animationblendmode   = add              # add | multiply | overlay\n          animationtime        = 12.0\n          animationdelay       = 0.0\n          animationlooping     = yes\n          animationrotation    = 180.0\n      }\n  }\n  # gfx/portraits/portraits/zz_<mod>_portraits.txt\n  portraits = { my_portrait = { spriteType = \"GFX_my_portrait\" } }\n  ```\n  The overlay's loop is entirely time-driven - `animationtime` is one period, there is no\n  per-frame control - and none of it runs in a portrait slot. Register the sprite in a `.gfx`, or\n  the name resolves to nothing and the engine logs `Invalid portrait configuration`\n  (`portraits.cpp:929`) naming the portrait key.\n* **A baked frame strip in a GUI surface you DO control** (a custom window, an event window, a\n  mod's own panel): `frameAnimatedSpriteType` is the animator, and it works there. This is where\n  the engine's frame animation is reachable - it is a portrait slot that is not wired to it, not\n  the primitive that is missing:\n  ```\n  frameAnimatedSpriteType = {\n      name = \"GFX_my_animated\"\n      texturefile = \"gfx/models/portraits/<name>_strip.dds\"\n      noOfFrames = 24\n      animation_rate_fps = 24\n      looping = yes\n      play_on_show = yes\n      transparencecheck = yes\n      alwaystransparent = yes\n  }\n  ```\n  Constraint that falls out of vanilla's own files: the texture must be a **horizontal strip**,\n  the frame width is `textureWidth / noOfFrames` (**make it divide exactly** - 23 vanilla strips do\n  not and the rounding is unestablished), and vanilla's five are RGBA32 with one mip. 24 frames at\n  70 px wide is 1680x70, which is inside the size range vanilla already ships.\n* **Maya** -> the only route to a portrait slot that genuinely animates. Measured against the\n  other three, it is not a preference but the only survivor: `texturefile` is a still, a\n  `spriteType` renders but is not played, and a `frameAnimatedSpriteType` is refused at load. If\n  the portrait must move, this is the route, and it is a **3D re-rig** - the illustration cut into\n  parts, each on its own plane, skinned to a skeleton - not a 2D animation authored frame by frame.\n  **`animated-portrait-route` is the canonical topic for this route** - it carries the two\n  sub-routes a mod can ship, the `pdxmesh` + `meshsettings` recipe that needs NO Maya, the shader\n  samplers, the `.mesh`/`.anim` container grammar and the tool reality. Read it before following\n  the four definition files below, because the re-skin route needs **none of them**.\n  If you are writing a mesh from scratch, follow the wiki's Maya workflow, then the four definition\n  files, in this order:\n  1. `gfx/models/portraits/<culture>/_<culture>_portrait_animations.asset`:\n     `animation = { name = \"my_idle_animation\"  file = \"my_idle.anim\" }`\n  2. `gfx/models/portraits/<culture>/_<culture>_portrait_meshes.gfx`:\n     `objectTypes = { pdxmesh = { name = \"my_portrait_mesh\"  file = \"gfx/models/portraits/<culture>/my_portrait.mesh\"\n     animation = { id = \"idle\" type = \"my_idle_animation\" }  scale = 1.0 } }`\n  3. `gfx/models/portraits/<culture>/_<culture>_portrait_entities.asset`:\n     `entity = { name = \"my_portrait_entity\"  pdxmesh = \"my_portrait_mesh\"  default_state = \"idle\"\n     state = { name = \"idle\" animation = \"idle\" animation_blend_time = 0.45 chance = 3.0 looping = no next_state = idle } scale = 1.0 }`\n  4. `gfx/portraits/portraits/zz_<mod>_portraits.txt`:\n     `portraits = { my_portrait = { entity = \"my_portrait_entity\"  clothes_selector = \"no_texture\"\n     attachment_selector = \"no_texture\"  greeting_sound = \"mammalian_01_greetings\"\n     character_textures = { \"gfx/models/portraits/<culture>/my_body.dds\" } } }`\n  5. optional `gfx/portraits/asset_selectors/zz_<mod>_clothes.txt` for clothes/hair variants (the\n     block shape is `name = { default = \"<dds>\"  species = { default = \"<dds>\" }  leader = { \"<dds>\" = { leader_class = scientist } } ... }`).\n\n  The smallest vanilla entity portrait is **one line**: `baol_room` at\n  `gfx/portraits/portraits/13_portraits_ancient_relics.txt:14`, which carries only the selectors\n  and a greeting sound and no `character_textures` at all.\n\n## 待确认\n\n* ~~**The `.mesh` and `.anim` internal layout beyond the container header.**~~ **Answered: the\n  format is READABLE, in `animated-portrait-route`.** The header is `@@b@!` + `\\x08` + `pdxasset` +\n  `i` + three u32s (2, 1, 0), and after it the container is a small tagged grammar - `'['` * depth +\n  name for a node, `0x21` + name length + name + a type letter for a property - which parses **406 of\n  406** portrait `.mesh` files and the `.anim` clips to the exact byte. A mesh material is\n  `{ shader = \"<effect>\" diff = \"<dds>\" [, n = ..., spec = ...] }`; an `.anim` is\n  `info { fps, sa, j }` plus one node per joint carrying `t`/`q`/`s`. `stellaris.exe` carries the\n  engine's own chunk/property token table, so the vocabulary is the engine's, not a guess. The\n  grammar, the token list and everything it buys (per-object texture override, animation names,\n  samplers) are in that topic - this one stops at the header on purpose.\n* ~~**Whether a portrait slot honours a `spriteType`'s overlay `animation = { }` block.**~~\n  **Answered 2026-10-06, in game: no.** The `spriteType` portrait route **renders** (the still\n  `spriteType` control drew its art) and the overlay animation is **not played** - the scrolling and\n  pulsing entries are exactly as still as the control. See **The closed negative**.\n* ~~**Whether `frameAnimatedSpriteType` can be named from a portrait definition at all.**~~\n  **Answered 2026-10-06, in game: no, and it is logged.** The engine refuses the portrait\n  definition by name at load - `portraits.cpp:929: Invalid portrait configuration specified for\n  \"zz_probe_d_frames\"` - while saying nothing about the sprite itself, so the portrait-side\n  reference is what is rejected. The refusal is the same validator that says nothing about the four\n  definitions that do work.\n* **The rounding rule for the 23 non-integral frame strips** (`43/3`, `107/2`, `544/3`, `259/8`,\n  `129/8`, `47/3`, `75/2`). The engine's own arithmetic is not visible from here.\n* **Whether `.png` is accepted for a portrait `texturefile` in 4.4.6.** One installed-but-**not\n  enabled** workshop mod (`2923834739`) ships PNG portrait art and writes\n  `texturefile = \"gfx/models/portraits/CoffeeGirl/CoffeeGirl27.png\"`, and the plugin's own\n  `TEXTURE_EXTENSIONS` includes `.png`. The probe round proved that the `texturefile` route\n  **renders a picture in a portrait slot** - but every texture it used was a `.dds`, so `.png`\n  specifically is still unverified for this route.\n* **Every on-screen claim except one.** The animation negative is the user's eyes against the\n  probe's own control (**The closed negative**); nothing else here was seen in a running game, and\n  the portrait route's *rendering* is the only thing that look also settled. Everything else is\n  measured from the files, the counts and the field shapes.\n* **The exact `animation_rate_fps` floor and ceiling, and any frame-count or texture-size limit.**\n  The install's largest strip is 128 frames and 1470 px wide; nothing states where the engine\n  refuses. This matters only for a `frameAnimatedSpriteType` in a GUI surface a mod controls - no\n  portrait slot reaches one.\n* **Whether a repeated `common/portrait_categories` block *adds to* or *replaces* vanilla's list.**\n  The probe's category block logged nothing either way, and the run that would have settled it\n  (whether vanilla and other mods' humanoids were still listed beside the probe's four) was not\n  observed. The four entries did appear, so the wire works; what it does to the rest of the list is\n  open.
"""

syntax_blocks = [
    "# 1. A PORTRAIT IS DEFINED HERE. `gfx/portraits/portraits/<nn>_portraits_<culture>.txt`.\n#    All 496 vanilla definitions take the `entity` route; the other two are documented in a\n#    comment at 00_portraits_main.txt:236-243 and used by MODS.\nportraits = {\n\tmam5 = {\tentity = \"portrait_mammalian_05_entity\" clothes_selector = \"mammalian_slender_clothes_01\" attachment_selector = \"no_texture\"\n\t\tgreeting_sound = \"mammalian_01_greetings\"\n\t\tcharacter_textures = {\n\t\t\t\"gfx/models/portraits/mammalian/mammalian_slender_05_orange.dds\"\n\t\t}\n\t\tcustom_close_up_scale = 2.0\n\t}\n\tmy_flat = { texturefile = \"gfx/models/portraits/my_art.dds\" }   # the static 2D mod route\n}\n\n# 2. THE PORTRAIT SLOT IS A RENDER TARGET. `interface/core.gfx:210-218`. NOT a texture:\n#    there is no size, `type` selects a layout block, `texturefile` is only the placeholder.\nportraitType = {\n\tname = \"GFX_portrait_room\"\n\teffectFile = \"gfx/FX/buttonstate_rendertarget.shader\"\n\ttype = room                     # character | character_large | room | empty_room\n\tcharacter = yes                 #   | character_without_room | planet\n\talternate_configurations = { holographic }\n}\n\n# 3. THE ONLY FRAME ANIMATOR. `interface/mapicons.gfx:3-12`. No shader. Not used for portraits.\nframeAnimatedSpriteType = {\n\tname = \"GFX_hover_indicator\"\n\ttexturefile = \"gfx/interface/system/hover_indicator.dds\"\n\tnoOfFrames = 21                 # horizontal strip: frame width = textureWidth / 21\n\ttransparencecheck = no\n\tanimation_rate_fps = 20\n\tlooping = yes\n\tplay_on_show = yes\n\talwaystransparent = yes\n}\n\n# 4. A STATE STRIP, WHICH DOES NOT ANIMATE: the engine draws frame 0.\nspriteType = {\n\tname = \"GFX_main_close_button\"\n\ttexturefile = \"gfx/interface/buttons/close_button.dds\"   # 114x38\n\tnoOfFrames = 3                                          # drawn 38x38\n}\n\n# 5. THE OVERLAY ANIMATION - a masked UV effect on a second texture. 632 blocks in vanilla.\nspriteType = {\n\tname = \"GFX_my_portrait\"\n\ttextureFile = \"gfx/models/portraits/my_art.dds\"\n\tanimation = {\n\t\tanimationtexturefile = \"gfx/models/portraits/my_shine.dds\"\n\t\tanimationmaskfile    = \"gfx/models/portraits/my_mask.dds\"\n\t\tanimationtype        = pulsing      # scrolling | pulsing | rotating | rotating_cw | rotating_ccw\n\t\tanimationblendmode   = add          # add | multiply | overlay\n\t\tanimationtime        = 12.0\n\t\tanimationdelay       = 0.0\n\t\tanimationlooping     = yes\n\t\tanimationrotation    = 180.0\n\t}\n}"
