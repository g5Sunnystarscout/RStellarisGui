body = """
## The verdict in one paragraph\n\n**环形世界没有\"星系级的环\"。** What the player sees as a ring is **twelve ordinary PLANET objects**,\nand each one is drawn by its own planet class' `entity` - a **30-degree ARC mesh** authored on a\ncircle of radius **450**:\n\n* a `planet = { class = pc_ringworld_habitable }` block in a\n  `common/solar_system_initializers/**` file **is** a segment. The class carries `ringworld = yes`\n  (`00_planet_classes.txt:1372`) and `entity = \"ringworld_habitable_entity\"` (`:1373`), which the\n  asset file defines as `pdxmesh = \"ringworld_habitable_01_mesh\"` ->\n  `gfx/models/planets/ringworld_habitable.mesh` (`_planetary_entities.asset:2991-2993`,\n  `_planetary_meshes.gfx:149-153`);\n* the ring's **radius** is the `change_orbit` written before the segments. All seven vanilla ring\n  systems write `change_orbit = 45`, and every one of their 50 segment blocks is at\n  `orbit_distance = 0` on that circle (48 of the 50; the other two are the Shattered Ring's\n  intentionally damaged seam at 5);\n* the ring's **segment count** is how many `planet = { class = pc_ringworld_* }` blocks the file\n  writes: **12** for `sanctuary_system`, **12** for `cybrex_beta`, **9** for the machine Fallen\n  Empire's `fallen_machine`, **6 of 12** for the Shattered Ring;\n* **`orbit_angle` is not what spreads them.** Four complete vanilla rings - Sanctuary (12),\n  Cybrex (12), the machine Fallen Empire (9) and the Shattered Ring's intact half - all declare\n  `orbit_angle = 30` on their segments, and **41 of the install's 50 ring blocks** do. The one place\n  vanilla spreads segments BY ANGLE is the Shattered Ring's own repair effect, which writes\n  `orbit_angle` -30 / 0 / 30 next to each other\n  (`federations_event_effects.txt:1793`, `:1799`, `:1806`);\n* the **ruined** parts are a different object type, not a damaged planet: `ring_world_ruined` is a\n  **megastructure** whose `entity = \"ringworld_destroyed_entity\"` ->\n  `gfx/models/planets/ringworld_destroyed.mesh` (`00_ring_world.txt:388-394`) - and the Shattered\n  Ring's dim arcs are two of those, spawned in the initializer's own `init_effect`\n  (`federations_initializers.txt:1920-1932`).\n\nA ring world is therefore a **picture assembled from planet objects**, and every knob a mod has -\nradius, segment count, which arc each segment is, colonisability, districts - is a field on an\ninitializer block or on a planet class. **There is no field that draws a ring.**\n\n## 待确认\n\n- **What the engine actually does with a `ringworld` body's declared `orbit_angle`.** The measurement\n  is strong - 41 of the install's 50 ring blocks write the same 30 and four complete vanilla rings\n  still render as four rings, which is impossible if the value were obeyed - but the MECHANISM (does\n  the engine assign the angle by index among the system's ring bodies? by the order of the blocks? by\n  a ring-specific layout?) was NOT established. No engine string names it: `ringworld` occurs 6 times\n  in `stellaris.exe` and every one is a trigger name, a localisation key or a class name. Settling it\n  needs a probe system with 12 segments at a deliberately wrong angle plus a screenshot, and this\n  round was read-only and launched nothing.\n- **What a ring with a segment count that is not 12 LOOKS like.** Twelve 30-degree arcs tile a circle\n  exactly, and the install ships 9, 6, 3 and 2 segment rings - but whether a 9-segment ring leaves a\n  90-degree GAP, overlaps, or is redistributed evenly (10-degree larger arcs that no longer meet) is\n  a rendering question no file answers. The arc meshes are fixed geometry, so a redistributed ring\n  would show gaps between arcs; that is inference, not measurement.\n- **Whether `ring_world_ruined`'s `entity = \"ringworld_destroyed_entity\"` is drawn at the ring's\n  radius or at its own mesh scale.** `ringworld_01_damaged_full_entity` carries `scale = 0.01`\n  (`_planetary_entities.asset:7771`) while `ringworld_destroyed_entity` (`:3372-3374`) carries none,\n  and the four ruined arcs are spawned at `orbit_distance = 45` (`federations_initializers.txt:1923`)\n  - but a megastructure section's drawn scale is the megastructure system's business, and this round\n  did not establish how the engine sizes one. The `ringworld_01_damaged_full_entity` scale of 0.01 is\n  recorded and unexplained.\n- **Whether the `pc_ringworld_habitable` clouds entity is attached and drawn in the SYSTEM view.**\n  `attach = { root = \"ringworld_habitable_entity_01_clouds_entity\" }`\n  (`_planetary_entities.asset:3028`) is unconditional in the asset file, and both cloud meshsettings\n  use `PdxMeshRingworldClouds`, but no entity state or `game_data` flag disables them for the system\n  view - the claim that they are drawn is the asset file's own structure, not an observation.\n- **The `+/-450` locators' role.** `ringworld_seam_entity_01_full_entity` (`:2971-2987`) places four\n  `ringworld_3x_seams_entity` at `+/-450` on the X and Z axes, and `ringworld_3x_seams_entity`\n  (`:2931-2967`) places two `ringworld_construction_entity` at `+/-225` - numbers that fit a radius-450\n  circle (the arc chord at 30 degrees is 232.9) but do not pin it, since the entity is the\n  megastructure's construction visual. The 450 reading in this topic comes from the SEGMENT MESH\n  bounding boxes, which are independent of these locators.\n- **Whether `ringworld_part.mesh` (1,636 bytes, unreferenced) is the renderer's own arc tile.** The\n  name and its size invite the reading that the engine composes a ring from one part mesh, and 0\n  files in the install name it. It is recorded as an unexplained asset.\n- **Whether the declared `orbit_angle` matters for a ring world's TRAVEL or targeting geometry**\n  (where a fleet enters the system, what a station orbits). `orbit_lines = no` on all nine ring-arc\n  classes says the orbit line is suppressed, and no vanilla script reads a ring segment's\n  `orbit_angle`, but the spatial answer was not measured.
"""

syntax_blocks = [
    "# ---------------------------------------------------------------------------------------\n# 1. THE CLASS CHAIN. A segment is a planet class; `entity` is what is DRAWN.\n#    common/planet_classes/00_planet_classes.txt:1371\n#    -> gfx/models/planets/_planetary_entities.asset:2991\n#    -> gfx/models/planets/_planetary_meshes.gfx:149\n# ---------------------------------------------------------------------------------------\npc_ringworld_habitable = {                      # :1371  THE habitable segment\n\tringworld = yes                             # :1372  <-- what `is_ringworld` reads\n\tentity = \"ringworld_habitable_entity\"       # :1373  -> an ENTITY, not a mesh\n\tpreview_entity = \"ringworld_01_damaged_full_entity\"   # :1374  the MEGASTRUCTURE preview art\n\tpicture = pc_ringworld                       # :1375  the planet-view backdrop\n\ticon = GFX_planet_type_ringworld            # :1376\n\ticon_large = GFX_planet_type_ringworld_big  # :1377\n\tentity_scale = 1.0                          # :1378\n\tenable_tilt = no                            # :1379  a ring has no axial tilt to show\n\tfixed_entity_scale = yes                    # :1380  <-- the segment is NOT sized by `size`\n\tatmosphere_color = hsv { 0.0 0.0 1.0 }      # :1381  a SCALAR BLOCK VALUE (see `## Breaks`)\n\tshow_city = yes                             # :1384\n\textra_orbit_size = 0                        # :1386  <-- and NOTHING here adds ring geometry\n\textra_planet_count = 0                      # :1387\n\tchance_of_ring = 0.0                        # :1388\n\tplanet_size = 10                            # :1389  the COLONY size, not the drawn size\n\tmoon_size = 1                               # :1390\n\tcolonizable = yes                           # :1391  <-- the ONE ring class a player can colonise\n\tdistrict_set = ring_world                    # :1392\n\tstarting_district = district_rw_city         # :1393\n\torbit_lines = no                             # :1396  <-- suppress the orbit line through the ring\n\tclimate = \"artificial\"                       # :1399\n\tis_artificial_planet = yes                   # :1400\n}\n# The other SEVEN segment classes are the same block with three fields changed - which entity, which\n# `colonizable`, which `district_set`:\n#   pc_ringworld_habitable_damaged  :1415  entity = \"ringworld_habitable_damaged_entity\"  colonizable = no\n#   pc_ringworld_tech               :1438  entity = \"ringworld_tech_entity\"               colonizable = no\n#   pc_ringworld_tech_damaged       :1463  entity = \"ringworld_tech_damaged_entity\"       colonizable = no\n#   pc_ringworld_seam               :1489  entity = \"ringworld_seam_entity\"               colonizable = no\n#   pc_ringworld_seam_damaged       :1515  entity = \"ringworld_seam_damaged_entity\"       colonizable = no\n#   pc_shattered_ring_habitable     :1541  entity = \"ringworld_habitable_entity\"  size 25, district_set shattered_ring_world\n#   pc_cybrex                       :999   entity = \"ringworld_habitable_entity\"  colonizable = no, `show_city = no`\n#   pc_ringworld_shielded            01_planet_classes_apocalypse.txt:5  entity = \"ringworld_habitable_entity\"\n# ...and TWO more classes carry `ringworld = yes` without being a segment of this shape:\n#   pc_egg_cracked                   00_planet_classes_distant_stars.txt:34  entity = \"shattered_infected_planet\"\n#     (the Distant Stars \"cracked egg\", which has its own entity and is NOT drawn as a ring)\n#\n# TEN classes in the install carry `ringworld = yes`. `fixed_entity_scale = yes` also appears on\n# pc_habitat, pc_cosmogenesis_world, pc_crystal_habitat, pc_warden_guardian, pc_habitat_shielded\n# and pc_ringworld_shielded - fourteen classes in all - so it is the \"an artificial object is not\n# sized by its planet_size\" switch, not a ring switch.\n\n# ---------------------------------------------------------------------------------------\n# 2. THE ENTITY AND THE MESH. `entity` -> a `.asset` entity -> a `pdxmesh` -> a `.mesh` file.\n#    gfx/models/planets/_planetary_entities.asset:2991-3029\n# ---------------------------------------------------------------------------------------\nentity = {\n\tname = \"ringworld_habitable_entity_01_entity\"   # :2991\n\tcull_radius = 500.0                             # :2992\n\tpdxmesh = \"ringworld_habitable_01_mesh\"         # :2993  -> ringworld_habitable.mesh (180,301 bytes)\n\n\tdefault_state = \"idle\"                          # :2995 a segment has an IDLE state, unlike a planet\n\tstate = { name = \"idle\" state_time = 100 time_offset = { 0 100 }\n\t\tstart_event = { trigger_once = yes sound = { soundeffect = \"ringworld_hum_idle_01\" stop_on_state_change = yes } }\n\t}\n\tstate = { name = \"construction\" start_event = { ... \"ringworld_construction_ambient\" } }\n\n\tmeshsettings = {                                # :3005  THE STRUCTURE\n\t\tname = \"pCube20Shape\"\n\t\ttexture_diffuse = \"ringworld_habitable_diffuse.dds\"\n\t\ttexture_normal = \"ringworld_habitable_normal.dds\"\n\t\ttexture_specular = \"ringworld_habitable_specular.dds\"\n\t\tshader = \"PdxMeshTerra\"\n\t}\n\tmeshsettings = {                                # :3014  THE LAND on the inside of the arc\n\t\tname = \"polySurface9Shape\"\n\t\ttexture_diffuse = \"continental_01_diffuse.dds\"\n\t\tshader = \"PdxMeshTerra\"\n\t}\n\tgame_data = {\n\t\tsize = @ringworld_segment_size               # :3024  the PLANET-VIEW size: @ringworld_segment_size = 50 (:2904)\n\t\tshader_type = ship\n\t}\n\tattach = { root = \"ringworld_habitable_entity_01_clouds_entity\" }   # :3028\n}\nentity = {                                          # :3032 the CLOUD layer, a separate entity\n\tname = \"ringworld_habitable_entity_01_clouds_entity\"\n\tpdxmesh = \"ringworld_habitable_01_clouds_mesh\"   # -> ringworld_habitable_clouds.mesh (21,914 bytes)\n\tmeshsettings = { shader = \"PdxMeshRingworldClouds\" }   # :3045/:3054 TWO meshsettings, one shader\n\tgame_data = { size = @ringworld_segment_size  uv_animation_speed = 0.004  uv_animation_direction = { 1.0 0.0 } }\n}\n# The arc meshes, all declared in ONE file (gfx/models/planets/_planetary_meshes.gfx):\n#   :149  ringworld_habitable_01_mesh         file = \"gfx/models/planets/ringworld_habitable.mesh\"       cull_distance = 999999999.0f\n#   :155  ringworld_habitable_01_clouds_mesh  file = \".../ringworld_habitable_clouds.mesh\"\n#   :161  ringworld_habitable_damaged_01_mesh file = \".../ringworld_habitable_damaged.mesh\"\n#   :167  ringworld_seam_01_mesh              file = \".../ringworld_seam.mesh\"\n#   :173  ringworld_seam_damaged_01_mesh      file = \".../ringworld_seam_damaged.mesh\"\n#   :179  ringworld_tech_01_mesh              file = \".../ringworld_tech.mesh\"\n#   :185  ringworld_tech_damaged_01_mesh      file = \".../ringworld_tech_damaged.mesh\"\n#   :217  ringworld_construction_mesh         shader = \"PdxMeshShip\"\n#   :234  ringworld_destroyed_mesh            <- the RUINED MEGASTRUCTURE's full ring\n#   :252  ringworld_01_damaged_full_mesh      <- the megastructure PREVIEW, two meshsettings on one shape\n#\n# THE AUTHORING RADIUS IS 450, MEASURED FROM THE MESH FILES THEMSELVES (the `aabb` min/max box of\n# each binary's first mesh entry, read with a scratch reader - see `## Evidence`):\n#   ringworld_habitable.mesh         box 246 x 58 x 88    ringworld_seam.mesh    box 239 x 61 x 33\n#   ringworld_tech.mesh              box 248 x 56 x 84    ringworld_seam_construction.mesh box 239 x 61 x 33\n#   ringworld_habitable_clouds.mesh  box 225 x 42 x 16\n# An ORDINARY planet mesh is 10 units across: planet_clouded.mesh's boxes are 10.39 / 7.58 / 8.90 /\n# 9.11 / 9.29. A 30-degree arc on a radius-450 circle is 2*450*sin(15) = 232.9 units of chord and\n# 2*pi*450*(30/360) = 235.6 units of arc, and the segments measure 235-248 - i.e. the meshes are\n# authored on the SAME 450-unit circle the game places them on at `orbit_distance = 45`.",
    "# ---------------------------------------------------------------------------------------\n# 3. EXAMPLE (a): THE SHATTERED RING. `origin_shattered_ring` -> `shattered_ring_start`.\n#    common/governments/civics/00_origins.txt:1872 and\n#    common/solar_system_initializers/federations_initializers.txt:1908\n# ---------------------------------------------------------------------------------------\norigin_shattered_ring = {                        # 00_origins.txt:1872  破碎之环 / \"Shattered Ring\"\n\tis_origin = yes                              # :1873\n\ticon = \"gfx/interface/icons/origins/origins_shattered_ring.dds\"   # :1874\n\tpicture = GFX_origin_shattered_ring          # :1875\n\tstarting_colony = pc_shattered_ring_habitable      # :1877  THE COLONY IS A RING SECTION\n\thabitability_preference = pc_shattered_ring_habitable  # :1878\n\tinitializers = { shattered_ring_start }      # :1879\n\tmax_once_global = yes                        # :1880\n\tnon_colonizable_planet_class_neighbor = yes  # :1881\n\tplayable = { host_has_dlc = Federations }    # :1884\n\tdescription = \"origin_tooltip_shattered_ring_effects\"   # :1901\n}\n\nshattered_ring_start = {                         # federations_initializers.txt:1908\n\tflags = { empire_home_system ring_world_built shattered_ring_system }   # :1909\n\tusage = origin                               # :1910\n\n\tinit_effect = {                              # :1912  THE RUINED HALF IS DRAWN BY MEGASTRUCTURES\n\t\tevery_neighbor_system = { set_star_flag = empire_cluster ... }       # :1913-1918\n\t\tgenerate_home_system_resources = yes     # :1919\n\t\tspawn_megastructure = {                  # :1920  RUINED arc 1 of 4\n\t\t\ttype = \"ring_world_ruined\"           #        -> entity \"ringworld_destroyed_entity\"\n\t\t\torbit_angle = 0                      # :1922\n\t\t\torbit_distance = 45                  # :1923  <-- THE RING RADIUS\n\t\t\tinit_effect = { set_megastructure_flag = guaranteed_1 }\n\t\t}\n\t\tspawn_megastructure = { type = \"ring_world_ruined\"  orbit_angle = 180  orbit_distance = 45 }   # :1928\n\t}\n\n\tclass = \"sc_g\"                               # :1935\n\tplanet = { class = star orbit_distance = 0 orbit_angle = 0 }             # :1936\n\n\tchange_orbit = 45                            # :1942  <-- THE RING RADIUS for every segment below\n\n\tplanet = { class = \"pc_ringworld_tech\"          name = \"NAME_Ring_Section\"  orbit_angle = 240  orbit_distance = 0 }   # :1944\n\tplanet = { class = \"pc_ringworld_seam\"          name = \"NAME_Ring_Section\"  orbit_angle = 30   orbit_distance = 0 }   # :1951\n\tplanet = {                                       # :1958  THE STARTING COLONY\n\t\tclass = \"pc_shattered_ring_habitable\"        #        the ONLY colonisable class here\n\t\torbit_angle = 30\n\t\torbit_distance = 0\n\t\tdeposit_blockers = none\n\t\tmodifiers = none\n\t\tstarting_planet = yes                        # :1964\n\t\tflags = { ignore_startup_effect megastructure }\n\t\tinit_effect = { prevent_anomaly = yes }\n\t}\n\tplanet = { class = \"pc_ringworld_tech_damaged\"  name = \"NAME_Ring_Section\"  orbit_angle = 120  orbit_distance = 0 }   # :1971\n\tplanet = {                                       # :1978  the RESEARCH target\n\t\tclass = \"pc_ringworld_seam_damaged\"\n\t\tname = \"NAME_Irreparable_Damage\"             # \"Catastrophic Damage\" (common_names_l_english.yml:56)\n\t\torbit_angle = 30\n\t\torbit_distance = 0\n\t\tflags = { ignore_startup_effect starting_mining_target starting_deposit catastrophic_damage }\n\t\tinit_effect = {\n\t\t\tcreate_ambient_object = { type = \"medium_debris_01_object\" entity_offset_height = -15 location = this }\n\t\t\tlast_created_ambient_object = { ... set_ambient_object_flag = interloper_damage }\n\t\t\tset_deposit = d_engineering_5              # :1999\n\t\t\tset_carrier_flag = starting_research_target\n\t\t}\n\t}\n\tplanet = {                                       # :2005  THE INTERLOPER, a non-ring body\n\t\tclass = \"pc_shattered_2\"\n\t\tname = \"NAME_The_Interloper\"\n\t\torbit_distance = -5                          # RELATIVE to the previous body (the seam at 45) -> 40\n\t\torbit_angle = 0\n\t\tsize = 5\n\t\thas_ring = no\n\t\tinit_effect = { set_deposit = d_minerals_10 }\n\t}\n\tplanet = { class = \"pc_ringworld_seam_damaged\"  name = \"NAME_Ring_Section\"  orbit_angle = 30  orbit_distance = 5 }    # :2018\n\tneighbor_system = { trigger = { num_guaranteed_colonies >= 2 } initializer = \"neighbor_t1\" ... }   # :2024-2033\n}\n# SIX ring planet blocks and TWO ruined megastructure arcs: 8 of the ring's 12 slots have something\n# in them, and the ring STARTS BROKEN - 3 intact sections (tech 240, seam 30, habitable 30) and 3\n# damaged (tech_damaged 120, seam_damaged 30 \"Irreparable Damage\", seam_damaged 30 at +5).\n# `pre_ftl_shattered_ring` (pre_ftl_initializers.txt:1352) is the SAME system, one line later, for\n# the pre-FTL version of the origin: identical angles, identical radii, identical classes.\n# The origin is `Federations`-gated (`:1884`) and `max_once_global` (`:1880`).",
    "# ---------------------------------------------------------------------------------------\n# 4. EXAMPLE (b): SANCTUARY. `sanctuary_system` - the identifier behind 保护地.\n#    common/solar_system_initializers/pre_ftl_initializers.txt:644\n# ---------------------------------------------------------------------------------------\nsanctuary_system = {                             # :644   \"### The Sanctuary\" is the comment above it\n\tasteroid_belt = { type = rocky_asteroid_belt  radius = 150 }   # :645  the ring AND a belt\n\tusage = misc_system_init                         # :649\n\tusage_odds = { base = @spawn_system_common  inline_script = \"solar_system_initializers/initializer_modifiers_habitable_world_systems\" }   # :650\n\tmax_instances = 1                                # :654\n\tprimitive_system = yes                           # :655  \"usage odds modified by primitives setup slider\"\n\tflags = { sanctuary_system ring_world_built ancient_wonders_system }   # :657\n\tscaled_spawn_chance = 2                          # :658\n\tname = \"NAME_Sanctuary\"                          # :660\n\tclass = \"sc_g\"                                   # :662\n\n\tplanet = {                                       # :664  THE STAR - and the system's OWNER\n\t\tclass = star\n\t\torbit_distance = 0\n\t\tinit_effect = {\n\t\t\tcreate_country = { name = \"NAME_Sanctuary\" type = faction }   # :669  a real COUNTRY\n\t\t\tlast_created_country = {\n\t\t\t\tsave_global_event_target_as = sanctuary                       # :674\n\t\t\t\tcreate_fleet = { ... create_ship = { design = \"NAME_Sanctuary_Core\" graphical_culture = \"fallen_empire_03\" } }   # :680\n\t\t\t\tadd_modifier = { modifier = sanctuary_power  days = -1 }      # :690\n\t\t\t\tsave_event_target_as = sanctuary_core\n\t\t\t\tset_fleet_flag = sanctuary_core\n\t\t\t\t# ...then FOUR defensive stations at distance 8, angles 90/180/270/0 (:698-761)\n\t\t\t}\n\t\t}\n\t}\n\n\tchange_orbit = 45                                # :766  <-- THE RING RADIUS, same 45 as everywhere\n\n\tplanet = { class = \"pc_ringworld_habitable\"  name = \"NAME_Sanctuary_A\"  orbit_angle = 30  orbit_distance = 0 ... }  # :768\n\tplanet = { class = \"pc_ringworld_tech\"       name = \"NAME_Sanctuary-B\"  orbit_angle = 30  orbit_distance = 0 ... }  # :801\n\tplanet = { class = \"pc_ringworld_seam\"       name = \"NAME_Sanctuary-C\"  orbit_angle = 30  orbit_distance = 0 ... }  # :824\n\tplanet = { class = \"pc_ringworld_habitable\"  name = \"NAME_Sanctuary-D\"  orbit_angle = 30  orbit_distance = 0 ... }  # :847\n\tplanet = { class = \"pc_ringworld_tech\"       name = \"NAME_Sanctuary-E\"  orbit_angle = 30  orbit_distance = 0 ... }  # :880\n\tplanet = { class = \"pc_ringworld_seam\"       name = \"NAME_Sanctuary-F\"  orbit_angle = 30  orbit_distance = 0 ... }  # :903\n\tplanet = { class = \"pc_ringworld_habitable\"  name = \"NAME_Sanctuary-G\"  orbit_angle = 30  orbit_distance = 0 ... }  # :926\n\tplanet = { class = \"pc_ringworld_tech\"       name = \"NAME_Sanctuary-H\"  orbit_angle = 30  orbit_distance = 0 ... }  # :959\n\tplanet = { class = \"pc_ringworld_seam_damaged\" name = \"NAME_Sanctuary-I\" orbit_angle = 30 orbit_distance = 0      # :982\n\t\tinit_effect = { create_ambient_object = { type = \"medium_debris_01_object\" location = THIS } } }   # the ONE broken section\n\tplanet = { class = \"pc_ringworld_habitable\"  name = \"NAME_Sanctuary-J\"  orbit_angle = 30  orbit_distance = 0 ... }  # :995\n\tplanet = { class = \"pc_ringworld_tech\"       name = \"NAME_Sanctuary-K\"  orbit_angle = 30  orbit_distance = 0 ... }  # :1028\n\tplanet = { class = \"pc_ringworld_seam\"       name = \"NAME_Sanctuary-L\"  orbit_angle = 30  orbit_distance = 0 ... }  # :1051\n\n\tchange_orbit = 105                               # :1075  the rocks live OUTSIDE the ring\n\tplanet = { count = { min = 1 max = 4 } class = pc_asteroid ... }   # :1077\n}\n# WHAT MAKES IT SPECIAL is in the four habitable blocks, and it is not the ring:\n#   * each carries `deposit_blockers = none` / `modifiers = none` / `prevent_anomaly = yes` and\n#     `generate_early_pre_ftls_on_planet = yes` (:798, :877, :956, :1025) - Sanctuary is the\n#     primitives-preserve system, and the primitives are generated on the RING SECTIONS;\n#   * each habitable block also spawns its own `NAME_Defensive_A_1` fleet at distance 1 from the\n#     section (:780-795), while the tech and seam blocks spawn `NAME_Defensive_A_2` (:808-821);\n#   * the star's block creates the guardian COUNTRY (`create_country = { type = faction }`, :669),\n#     a named core ship (`NAME_Sanctuary_Core`, :682) with `modifier = sanctuary_power` (:691)\n#     and four defensive stations (:698-761);\n#   * `primitive_system = yes` (:655) is what ties its spawn odds to the primitives galaxy slider,\n#     and `scaled_spawn_chance = 2` (:658) scales by galaxy size;\n#   * the ring is INTACT except section I, which is `pc_ringworld_seam_damaged` and carries a\n#     `medium_debris_01_object` ambient object (:989-992).\n# The shipped Chinese calls it 避难所 (\"refuge\", initializers_names_l_simp_chinese.yml:400); the\n# Russian calls it Заповедник (\"nature reserve\", :400 in the Russian file), which is the sense the\n# user's 保护地 (\"protected area\") was reaching for. The identifier is `sanctuary_system`.",
    "# ---------------------------------------------------------------------------------------\n# 5. HOW A COMPLETE RING IS BUILT - the megastructure is the SCAFFOLD, and each of its four\n#    sections spawns THREE planet segments when it completes. common/megastructures/00_ring_world.txt\n# ---------------------------------------------------------------------------------------\nring_world_2_intermediate.on_build_complete = {  # :183   the stage that clears the system\n\tevery_system_planet = { limit = { is_star = no } remove_planet = yes }   # :184-187  <-- WIPES THE SYSTEM\n\tset_asteroid_belt = { radius = 0 }           # :188-190  <-- the belt is zeroed, not removed\n\tremove_megastructure = fromfrom              # :192\n\tspawn_megastructure = { name = \"NAME_Ring_Section_A\"  type = \"ring_world_2\"  orbit_angle = 0    orbit_distance = 45  owner = from  planet = star }   # :193\n\tspawn_megastructure = { ... orbit_angle = 90  ... }    # :202\n\tspawn_megastructure = { ... orbit_angle = 180 ... }    # :211\n\tspawn_megastructure = { ... orbit_angle = 270 ... }    # :220   <- FOUR scaffold sections, 90 apart\n}\nring_world_3_intermediate.on_build_complete = {  # :284   the stage that turns ONE of them into planets\n\tspawn_planet = { class = \"pc_ringworld_tech\"       location = fromfrom  orbit_angle_offset = 30   ... }  # :290\n\tspawn_planet = { class = \"pc_ringworld_seam\"       location = fromfrom                              ... }  # :308\n\tspawn_planet = { class = \"pc_ringworld_habitable\"  location = fromfrom  orbit_angle_offset = -30  ... }  # :325\n\tfromfrom.planet = { set_carrier_flag = has_megastructure }   # :346\n\tremove_megastructure = fromfrom              # :349  <-- the site is GONE, the planets remain\n\t# ...then A/B/C/D naming by the star flags ring_section_1..3                                          # :350-383\n}\n# 4 scaffold sections x 3 spawned planets = 12, and the offsets are -30 / 0 / +30 OF THE SCAFFOLD'S\n# ANGLE - i.e. the three segments fill one 90-degree quadrant at 30-degree steps. The repair path is\n# the same code twice: `ring_world_restored.on_build_complete` (:470-533) is a copy of stage 3, and\n# `spawn_shattered_ring_guaranteed_1_effect` / `_2_effect`\n# (common/scripted_effects/federations_event_effects.txt:1789 and :1822) is the same three-segment\n# pattern as an effect, with `orbit_angle` -30 / 0 / 30 and `orbit_distance = 45` written out.",
    "# ---------------------------------------------------------------------------------------\n# 6. WHAT A MOD ACTUALLY WRITES. The segment count and the radius are initializer fields, and that\n#    is the whole mod-facing surface for the SHAPE.\n# ---------------------------------------------------------------------------------------\n# (a) A RING AT GAME START: a complete ring is 12 segments at `orbit_distance = 0` on a `change_orbit`\n#     radius. Sanctuary is the smallest complete vanilla example - copy its twelve `planet` blocks.\nring_system = {\n\tclass = \"sc_g\"\n\tflags = { ring_world_built }\n\tplanet = { class = star orbit_distance = 0 }\n\tchange_orbit = 45                            # <-- THE RADIUS (45 in every vanilla ring)\n\tplanet = { class = \"pc_ringworld_habitable\" orbit_angle = 30 orbit_distance = 0 }\n\tplanet = { class = \"pc_ringworld_tech\"      orbit_angle = 30 orbit_distance = 0 }\n\tplanet = { class = \"pc_ringworld_seam\"      orbit_angle = 30 orbit_distance = 0 }\n\t# ...nine more, any order\n}\n\n# (b) A RUINED / PARTIAL RING - TWO different objects, and vanilla uses both:\n#     * the RUINED arcs are MEGASTRUCTURE sections (`ring_world_ruined`, `00_ring_world.txt:388`),\n#       spawned from the initializer's own `init_effect` (`federations_initializers.txt:1920`);\n#     * the REST of a partial ring is DAMAGED PLANET CLASSES (`pc_ringworld_tech_damaged`,\n#       `pc_ringworld_seam_damaged`, `pc_ringworld_habitable_damaged`) - the classes a\n#       planet-killer swaps in when it cracks a segment\n#       (`00_scripted_effects.txt:4572`, `:4593`, `:4598`, `:4603`).\n#     A GAP is expressed by writing FEWER blocks. Nothing requires 12: the install ships rings of\n#     12, 12, 9, 6, 6, 3 and 2 segments and two rings of ZERO (all megastructure ruins:\n#     `cybrex_system`, prescripted_species_systems.txt:1928, and `ring_world_init_01`,\n#     utopia_initializers.txt:819).\nprobe_partial_ring = {\n\tflags = { ring_world_built }\n\tclass = \"sc_g\"\n\tplanet = { class = star orbit_distance = 0 }\n\tchange_orbit = 45\n\tplanet = { class = \"pc_ringworld_habitable\" orbit_angle = 30  orbit_distance = 0 }\n\tplanet = { class = \"pc_ringworld_tech_damaged\" orbit_angle = 120 orbit_distance = 0 }\n\tplanet = { class = \"pc_ringworld_seam_damaged\" orbit_angle = 240 orbit_distance = 0 }\n\t# THREE of twelve: the rest of the circle is simply not there.\n}\n\n# (c) MAKE A SEGMENT COLONISABLE - it is `colonizable` on the CLASS, and nothing else:\n#     `pc_ringworld_habitable` yes (:1391), `pc_shattered_ring_habitable` yes (:1561),\n#     every other ring class no. A mod's own ring class is the same block with its own `entity`,\n#     `district_set` and `colonizable`. `district_set` is a free-form tag (`00_planet_classes.txt:35`)\n#     and the install ships `ring_world` (`04_ringworld_districts.txt:24`) and `shattered_ring_world`\n#     (`00_urban_districts.txt:26`).\n\n# (d) CHANGE THE RADIUS - move the `change_orbit`, and keep every segment at `orbit_distance = 0`:\nchange_orbit = 80                                 # a radius-80 ring: the segments follow\nplanet = { class = \"pc_ringworld_habitable\" orbit_distance = 0 ... }\n#     Changing ONE segment's `orbit_distance` instead is what the\n#     `ringworld-segment-orbit-inconsistent` rule reports (src/lib/colonization.mjs): a segment that\n#     is not on the circle the others describe. The install's own exception is the Shattered\n#     Ring's `NAME_Irreparable_Damage` seam at `orbit_distance = 5`.\n\n# (e) CHANGE THE SEGMENT COUNT - write more or fewer `planet` blocks. There is no counter to set.\n#     (The visual consequence of a count that is not 12 is not measured; see `## 待确认`.)",
    "# ---------------------------------------------------------------------------------------\n# 7. WHAT A MOD CAN ASK AT RUNTIME. A segment is an ORDINARY PLANET, so it answers planet triggers.\n# ---------------------------------------------------------------------------------------\nis_ringworld = yes                   # the engine trigger, `planet ship` scope - `ringworld = yes` on the class\nPLANET_IS_RINGWORLD                  # localisation, \"Is a Ringworld\" (triggers_effects_l_english.yml:138)\nhas_ringworld_output_boost = { is_ringworld = yes }   # common/scripted_triggers/00_scripted_triggers.txt:605-607\nhas_star_flag = ring_world_built     # the SYSTEM-level marker: vanilla's habitat, orbital ring and\n                                     # cosmogenesis world all refuse a system that has it\n                                     # (habitats.txt:157, 15_orbital_ring.txt:107, 16_cosmogenesis_world.txt:102)\n# A segment is in the system's PLANET LIST (`every_system_planet`), so vanilla's own ring-aware\n# scripts find it with planet triggers - `change_pc = pc_ringworld_habitable_damaged` when a\n# planet-killer cracks one (00_scripted_effects.txt:4572), `limit = { is_ringworld = yes }` in the\n# machine-age ring effects (02_machine_age_effects.txt:1420)."
]

evidence = [
    "vanilla, the two examples, fully read. Shattered Ring: origin_shattered_ring (common/governments/civics/00_origins.txt:1872-1914) is starting_colony = pc_shattered_ring_habitable (:1877), initializers = { shattered_ring_start } (:1879), playable = { host_has_dlc = Federations } (:1884), max_once_global = yes (:1880); its initializer shattered_ring_start (common/solar_system_initializers/federations_initializers.txt:1908-2034) declares flags = { empire_home_system ring_world_built shattered_ring_system } (:1909), change_orbit = 45 (:1942) and SIX ring-class planet blocks - pc_ringworld_tech at orbit_angle = 240 (:1944), pc_ringworld_seam at 30 (:1951), pc_shattered_ring_habitable at 30 as the starting_planet (:1958-1969), pc_ringworld_tech_damaged at 120 (:1971), pc_ringworld_seam_damaged named NAME_Irreparable_Damage at 30 (:1978-2003, with set_deposit = d_engineering_5 at :1999) and a second pc_ringworld_seam_damaged at 30 with orbit_distance = 5 (:2018) - plus the non-ring pc_shattered_2 \"Interloper\" at orbit_distance = -5 (:2005-2016) and TWO spawn_megastructure = { type = \"ring_world_ruined\" } at angles 0 and 180 with orbit_distance = 45 (:1920-1932). Sanctuary: sanctuary_system (common/solar_system_initializers/pre_ftl_initializers.txt:644-1090) is flags = { sanctuary_system ring_world_built ancient_wonders_system } (:657), class = \"sc_g\" (:662), primitive_system = yes (:655), scaled_spawn_chance = 2 (:658), max_instances = 1 (:654), change_orbit = 45 (:766) and TWELVE ring-class blocks at orbit_angle = 30 / orbit_distance = 0 - four pc_ringworld_habitable (:768, :847, :926, :995), four pc_ringworld_tech (:801, :880, :959, :1028), three pc_ringworld_seam (:824, :903, :1051) and ONE pc_ringworld_seam_damaged (:982, with a medium_debris_01_object at :989-992) - over a star block (:664-764) that creates the guardian country (create_country = { name = \"NAME_Sanctuary\" type = faction }, :669), the NAME_Sanctuary_Core ship with modifier = sanctuary_power (:680-694) and FOUR defensive stations at distance 8 (:698-761), and under an asteroid_belt = { type = rocky_asteroid_belt radius = 150 } (:645). Each of the four habitable blocks carries generate_early_pre_ftls_on_planet = yes (:798, :877, :956, :1025) - the primitives are generated ON THE RING SECTIONS - and spawns its own NAME_Defensive_A_1 fleet (:780-795).",
    "measured, the ring-body census, over all 360 vanilla initializers in 40 files: 50 planet blocks name a ringworld = yes class, and they belong to exactly 7 initializers - cybrex_beta 12 (crisis_initializers.txt:312), sanctuary_system 12, fallen_machine 9 (fallen_empire_initializers.txt:2404), shattered_ring_start 6, pre_ftl_shattered_ring 6 (pre_ftl_initializers.txt:1352), fallen_machine_2 3 (fallen_empire_initializers.txt:2727), hostile_init_void_cloud 2 (distant_stars_initializers.txt:782). Their declared orbit_angle histogram is 30 x41, 240 x3, -30 x2, 120 x2, 130 x1, 60 x1; their orbit_distance histogram is 0 x48 and 5 x2 (the Shattered Ring's NAME_Irreparable_Damage seam in both the origin and its pre-FTL twin). 41 of 50 write the SAME angle.",
    "vanilla + measured, the radius is 45 in every vanilla ring, and it is a change_orbit: shattered_ring_start (:1942), sanctuary_system (:766), fallen_machine (:2427), pre_ftl_shattered_ring (pre_ftl_initializers.txt:1390) and fallen_machine_2 (fallen_empire_initializers.txt:2796) all write change_orbit = 45 after the star block; the repair path writes it as orbit_distance = 45 on each spawned segment instead (federations_event_effects.txt:1794, :1800, :1807); and the megastructure's own scaffold is placed at orbit_distance = 45 (00_ring_world.txt:197, :206, :215, :224), as are both ruined arcs of the Shattered Ring (federations_initializers.txt:1923, :1931). cybrex_beta writes change_orbit = 45 at crisis_initializers.txt:375 and hostile_init_void_cloud at distant_stars_initializers.txt:874 (there at radius 100, for two damaged segments).",
    "measured / mesh, the meshes are 30-degree arcs authored on a radius-450 circle - the measurement that ties the geometry to the asset. Read with a scratch aabb reader over the binaries, each ringworld_* mesh's first mesh entry has a bounding box of ringworld_habitable.mesh 246 x 58 x 88, ringworld_seam.mesh 239 x 61 x 33, ringworld_tech.mesh 248 x 56 x 84, ringworld_habitable_damaged.mesh 246 x 57 x 88, ringworld_seam_damaged.mesh 239 x 63 x 85, ringworld_tech_damaged.mesh 248 x 54 x 75, and ringworld_seam_construction.mesh 239 x 61 x 33. For comparison the SAME reader on ordinary planet meshes returns planet_clouded.mesh 10.39 x 10.38 x 10.39, planet_non_clouded.mesh 10.39 and planet_no_pole_no_clouds.mesh 10.39 - an ORDER OF MAGNITUDE smaller. A 30-degree arc on a radius-450 circle is 2 x 450 x sin(15 deg) = 232.9 units of chord and 235.6 of arc, and the measured segment widths are 235-248; at radius 45 the same arc would be 23 units and at radius 4500 it would be 2329. The polySurface34Shape / polySurface35Shape cloud mesh measures 225 x 42 x 16. The full-ring meshes are in the same file and are unmistakably FULL circles: ringworld_01_damaged_full.mesh's box is 963.68 x 61.09 x 963.68 (centred on +/-481.84) and ringworld_destroyed.mesh's are up to 668 x 98 x 194 - i.e. a full ring asset exists, and it belongs to the megastructure, not to the intact ring.",
    "vanilla, the entity chain, per class, quoted: _planetary_entities.asset:2991-3029 ringworld_habitable_entity_01_entity (pdxmesh = \"ringworld_habitable_01_mesh\", two meshsettings - pCube20Shape with ringworld_habitable_* textures and polySurface9Shape with continental_01_diffuse.dds - game_data = { size = @ringworld_segment_size  shader_type = ship }, attach = { root = \"ringworld_habitable_entity_01_clouds_entity\" }, and idle / construction states whose idle state plays ringworld_hum_idle_01 / _02 and whose construction state plays ringworld_construction_ambient); :3032-3062 the clouds entity (pdxmesh = \"ringworld_habitable_01_clouds_mesh\", two meshsettings both shader = \"PdxMeshRingworldClouds\", game_data = { size = @ringworld_segment_size uv_animation_speed = 0.004 uv_animation_direction = { 1.0 0.0 } }); :3065-3091 ringworld_tech_entity_01_entity (pdxmesh = \"ringworld_tech_01_mesh\", shader = \"PdxMeshTerra\", and an idle state that fires particle = \"ringworld_tech_particle\" at nodes tech_1 and tech_3 every 5 seconds - the tech section is the ANIMATED one); :3096-3125 ringworld_seam_entity_01_entity (pdxmesh = \"ringworld_seam_01_mesh\", two meshsettings - ringworld_seam_* and ringworld_construction_* - so a seam shows the bare frame); :3128-3150 ringworld_phase_3_construction_entity (pdxmesh = \"ringworld_seam_01_mesh\" with locator = { name = \"locator1\" position = { -225 0 -60.289 } rotation = { -30 0 0 } } and locator2 mirrored, and attach = { locator1 = \"ringworld_habitable_entity_01_entity\"  locator2 = \"ringworld_tech_entity_01_entity\" } - the BUILDING site composes a habitable and a tech section); :7747-7766 the three _damaged entities (each a bare pdxmesh with no meshsettings, no states and no textures - they render the mesh's own materials); :3372-3414 ringworld_destroyed_entity (pdxmesh = \"ringworld_destroyed_mesh\", five meshsettings on ringworld_habitable_damagedShape / ringworld_tech_damagedShape, including texture_diffuse = \"barren_01_diffuse.dds\" on index 0); :7768-7772 ringworld_01_damaged_full_entity (pdxmesh = \"ringworld_01_damaged_full_mesh\", scale = 0.01); :2904 @ringworld_segment_size = 50; :2931-2967 ringworld_3x_seams_entity (pdxmesh = \"ringworld_construction_mesh\", two attach slots on locators locator1/locator2 at position = { -225 0 -60.289 }).",
    "vanilla, the mesh declarations (gfx/models/planets/_planetary_meshes.gfx): the ringworld_habitable_01_mesh / _clouds_mesh / _damaged / ringworld_seam_01_mesh / ringworld_seam_damaged_01_mesh / ringworld_tech_01_mesh / ringworld_tech_damaged_01_mesh blocks are :149-189, every one cull_distance = 999999999.0f; ringworld_construction_mesh (:217-225) is the one with a meshsettings = { shader = \"PdxMeshShip\" } override; ringworld_destroyed_mesh (:234-238) and ringworld_01_damaged_full_mesh (:252-273, two meshsettings on g_body2Shape index 0 and 1) are the megastructure assets. The mesh FILES: ringworld_habitable.mesh 180,301 bytes, ringworld_habitable_clouds.mesh 21,914, ringworld_habitable_damaged.mesh 349,216, ringworld_seam.mesh 235,563, ringworld_seam_damaged.mesh 281,500, ringworld_tech.mesh 103,118, ringworld_tech_damaged.mesh 290,262, ringworld_construction.mesh 120,481, ringworld_seam_construction.mesh 115,426, ringworld_part.mesh 1,636 (referenced by NOTHING in the install - 0 hits for the string in every .asset and .gfx), ringworld_01_damaged_full.mesh 2,304,470 and ringworld_destroyed.mesh 921,747.",
    "measured, every entity name is a <graphical_culture>_<base>_entity variant, and the install writes 17 cultures' worth: _planetary_entities.asset defines the base ringworld_habitable_entity_01_entity (:2991), ringworld_tech_entity_01_entity (:3065), ringworld_seam_entity_01_entity (:3096), ringworld_seam_entity_01_full_entity (:2971, cull_radius = 10000.0 with four locators at +/-450), ringworld_construction_entity (:2907), ringworld_3x_seams_entity (:2931), ringworld_phase_3_construction_entity (:3128), ringworld_destroyed_entity (:3372) and the three _damaged entities - and then repeats the whole set per culture prefixed with the culture id: arthropoid_01_ (:3162-:3445), avian_01_ (:3445-:3689), fungoid_01_ (:3752-), mammalian_01_ (:4154-), molluscoid_01_, plantoid_01_, reptilian_01_, lithoid_01_, necroid_01_, nemesis_01_, aquatic_01_, toxoid_01_, cybernetics_01_, synthetics_01_, mindwarden_01_, biogenesis_01_/_02_, psionic_01_ and infernal_01_ - which is why set_planet_entity = { entity = \"ringworld_tech_entity_01_entity\"  graphical_culture = fromfrom } (00_ring_world.txt:296-299) takes a culture WITH the entity name. This is the same culture-prefix convention the portrait route documents, and it is why the planet class' BARE entity = \"ringworld_habitable_entity\" name",
    "which no .asset defines verbatim - still resolves.",
    "vanilla, the structure the whole ring is a copy of, and it is the megastructure's, not a planet's: 00_ring_world.txt:143-229 ring_world_2_intermediate (the stage whose construction_entity = \"ringworld_seam_entity_01_full_entity\" at :145) removes every_system_planet = { limit = { is_star = no } remove_planet = yes } (:184-187), zeroes the belt (set_asteroid_belt = { radius = 0 }, :188-190), removes itself (:192) and spawns FOUR ring_world_2 sections at orbit_angle 0/90/180/270 and orbit_distance = 45 (:193-228); it ends (ring_world_1, :3-140) with set_star_flag = ring_world_built (:138). Stage 3 (:245-385) spawns the three planets with orbit_angle_offset 30 / (none) / -30 (:293, :308, :328), sets each one's entity with set_planet_entity = { entity = \"ringworld_*_entity_01_entity\"  graphical_culture = fromfrom } (:296, :313, :331), sets set_carrier_flag = megastructure on each, marks the system with set_carrier_flag = has_megastructure (:346-348), then remove_megastructure = fromfrom (:349) and names the habitable section A-D by star flag (:350-383). orbit_angle_offset occurs in exactly one vanilla file, four times - all in 00_ring_world.txt (:293, :328, :479, :515) - measured with a brace-depth pass over all 30 common/megastructures/ files, alongside 8** spawn_planet calls (6 of them here, one in 16_cosmogenesis_world.txt:181, one in habitats.txt:361).",
    "vanilla, the ruined ring is a megastructure TYPE, and the two systems that are a ring world entirely of ruins prove it: 00_ring_world.txt:388-395 ring_world_ruined = { entity = \"ringworld_destroyed_entity\"  portrait = \"GFX_megastructure_construction_background\"  potential = { always = no } } (script-spawned only), and it is spawned by cybrex_system (prescripted_species_systems.txt:1928, four at 0/90/180/270, orbit_distance = 45, :2053-2070), ring_world_init_01 (utopia_initializers.txt:819, four at 0/90/180/270, :965-982), fallen_machine_2 (:2803, :2808, :2813), fallen_machine_3 (:2988-3003) and pre_ftl_shattered_ring (pre_ftl_initializers.txt:1380, :1388). Reading the AST of every initializer: those two ruin-only systems place ZERO ringworld = yes planets, so a reader that looks only for ring planet classes reports them as having no ring at all.",
    "vanilla, the damaged classes are what a planet-killer leaves behind, so \"ruined vs intact\" is a change_pc and not a mesh switch: common/scripted_effects/00_scripted_effects.txt:4570-4573 else_if = { limit = { is_ringworld = yes } spawn_ringworld_cracker_effect = yes  change_pc = pc_ringworld_habitable_damaged }, :4596-4599 pc_ringworld_tech -> pc_ringworld_tech_damaged and :4600-4604 pc_ringworld_seam -> pc_ringworld_seam_damaged. hostile_init_void_cloud (distant_stars_initializers.txt:876-896) is the pristine example of a two-segment ruined arc: pc_ringworld_tech_damaged at orbit_angle = 30 and pc_ringworld_seam_damaged at orbit_angle = 130, both orbit_distance = 0, each with create_ambient_object = { type = \"medium_debris_01_object\" }.",
    "measured, the ring is planets and the log says nothing about it. A brace-depth pass over all 30 common/megastructures/ files finds 19 loops over a system's planets (every_system_planet / random_system_planet), and the ring world's is the only one that REMOVES every non-star body: 00_ring_world.txt:184-187. The others read or move bodies (01_dyson_sphere.txt:828, :847, :989, :1008; 17_orbital_arc_furnace.txt:90, :397, :528, :659; 22_galactic_crucible.txt:102, whose :113/:115 are the other two remove_planet sites). A ring world therefore wipes: every non-star planet in the system (:184-187), the asteroid belt (zeroed, :188-190), and with them whatever colonies, deposits, orbital stations, anomalies and primitive enclaves those bodies carried - the star, the starbase and the system's ownership are untouched, and the ring's own twelve colonies are created by the player afterwards. The ONLY record any of it leaves is the engine's own error log, and it records no ring event at all: measured on the 2026-10-06 launch, logs/error.log contains 0 lines matching ringworld / ring_world / ring world, while it contains six [gamerendering.cpp:1174]: Failed to create system light <name> lines - the failed-light distinction the black-hole-primary-star-system topic records. There is no \"ring world completed\" line to search for.**",
    "binary, the engine's own vocabulary: ringworld (offset 38477120, beside trigger_scope, attraction, can_create, is_potential, support_effects), is_ringworld (38593424, in a trigger-name run beside has_access_construction / has_access_civilian / can_access_system), and the documentation string at 40679266-40679306 - *\"Checks if the planet is a ringworld. is_ringworld = yes  PLANET_IS_RINGWORLD ... PLANET_IS_NOT_RINGWORLD\"* - which is the trigger's own help text with its two localisation keys inline. customization_view_ringworld (39743819) is the other real occurrence, and it is a species-customisation camera pose, not system geometry: gfx/worldgfx/customization_view_ringworld.txt is world = customization_view_ringworld on line 5, and common/defines/00_defines.txt:26-29 gives it ENTITY_SPRITE_CUSTOMIZE_RINGWORLD_CAM_DIR = { -1.0 -0.75 0.3 }, ..._CAM_LOOK_AT = { 0 0 0 } and ..._ZOOM_SCALE = 1.9. gfx/worldgfx/ contains exactly one ring-named file and it is that one; the other 19 are star_*_class.txt, default.txt, system_view.txt and the other customization/ship-designer poses. There is no ring worldgfx.",
    "measured, the trigger and the flag a mod reads, from files rather than from a log (the engine's script documentation dump was regenerated empty by the 21:26 launch, so nothing here is quoted from triggers.log): common/scripted_triggers/00_scripted_triggers.txt:605-607 has_ringworld_output_boost = { is_ringworld = yes }; localisation/english/triggers_effects_l_english.yml:138-139 PLANET_IS_RINGWORLD:0 \"Is a Ringworld\" / PLANET_IS_NOT_RINGWORLD (and the shipped Chinese at simp_chinese/triggers_effects_l_simp_chinese.yml:138-139: 是环形世界 / 不是环形世界); is_ringworld is used as a planet limit at 00_scripted_effects.txt:4570/:4591, 02_machine_age_effects.txt:1364/:1387/:1407/:1420/:2209/:2236, shroud_shadows_scripted_effects.txt:273 and crisis_events_1.txt:2986/:3068 (15 uses in common/scripted_effects/ + common/scripted_triggers/ + events/**, measured); has_star_flag = ring_world_built is the SYSTEM test, used to refuse a second ring in habitats.txt:157, 15_orbital_ring.txt:107, 16_cosmogenesis_world.txt:102 and 21_behemoth_egg.txt:67/:283 (17 occurrences install-wide, measured).",
    "measured, the district sets, which is what a colonised segment actually gives a player: common/districts/04_ringworld_districts.txt is district_rw_city (:9) and its siblings on uses_district_set = ring_world (:24, :30), while shattered_ring_world is used by common/districts/00_urban_districts.txt:26, :55, :1049, ... and 02_rural_districts.txt:24, :34, :146, :274 - so pc_ringworld_habitable (district_set = ring_world, starting_district = district_rw_city) and pc_shattered_ring_habitable (district_set = shattered_ring_world, no starting_district) are the same kind of object with a different district table.",
    "measured, this round's own analyser, which is where the two rules below live: src/lib/colonization.mjs's readRingWorldSystems / analyseRingWorlds, and the selftest group \"a ring world is a set of planet objects, and its radius and segment count are in the initializer (RING)\" in scripts/selftest.mjs. Run over the install: 10 ringworld = yes classes, 9 of them with orbit_lines = no, 7 ring systems with segments plus 2 that are all ruins, 2 findings - both the Shattered Ring's deliberate NAME_Irreparable_Damage seam - and 0 errors. The reader is asserted to find the Cybrex ring's 12 segments (four of which are nested inside its STAR body, crisis_initializers.txt:377) rather than 8, which is what a depth-1-only walk returns.",
    "log, the honest negative, and a warning for the next reader: the engine's script documentation dump under %USERPROFILE%/Documents/Paradox Interactive/Stellaris/logs/script_documentation/ was regenerated EMPTY at 21:26:19 on 2026-10-06 by a game launch that was not this round's (all five files are 0 bytes), and the install's own <Stellaris>/logs/ is empty as before. So no line in this topic is quoted from triggers.log/effects.log/scopes.log; the engine-side evidence here is the BINARY strings and logs/error.log, which the same launch did write."
]

rules = [
    "A ring world is drawn PER SEGMENT, and there is no system-level ring object to find. Each segment is an ordinary planet whose class carries ringworld = yes and an entity; that entity's pdxmesh is one 30-degree arc. A mod that looks for \"the ring mesh\" as one object will find ringworld_01_damaged_full_mesh and ringworld_destroyed_mesh - and those are the RUINED MEGASTRUCTURE's art and its preview, not the intact ring.",
    "The radius is the change_orbit before the segments, and it is 45 in every vanilla ring. The segments then sit on that circle with orbit_distance = 0. To resize a ring, move the change_orbit (or write orbit_distance = 45 explicitly on each spawned segment, which is what the repair path does); do NOT give one segment a different orbit_distance, because a ring is one circle at one radius - that is what ringworld-segment-orbit-inconsistent reports.",
    "**The segment count is how many planet = { class = pc_ringworld_* } blocks the file writes.** Twelve is the designed number (4 scaffold sections x 3 spawned segments = 12, and the arc meshes are 30 degrees), but nothing enforces it: the install ships rings of 12, 12, 9, 6, 6, 3, 2 and two of 0. A GAP is simply a slot no block fills - vanilla never writes a \"missing segment\" marker.",
    "orbit_angle is NOT what spreads the segments, and this is the point a mod is most likely to get wrong. 41 of the install's 50 ring blocks declare the SAME orbit_angle = 30 and four complete vanilla rings still render as four rings, so the engine positions a ringworld body by its place in the ring rather than by the declared angle. The one place vanilla DOES write angles for segments is the Shattered Ring's repair effects, which place three segments at -30 / 0 / +30 of the section they repair. Writing a nice 0/30/60/... sequence is harmless but is not what makes the ring; see ## 待确认 for the part of this that is inference.",
    "orbit_angle_offset is the ring world's own field, and it exists in exactly one vanilla file. Four uses, all in common/megastructures/00_ring_world.txt (:293, :328, :479, :515), where it places a spawned segment +/-30 degrees off the section that spawned it. It is the field that distributes a 90-degree scaffold quadrant's three segments evenly.",
    "The ring is planets, so a mod counts it with planet triggers. is_ringworld = yes on planet ship scope is the engine's own predicate and has_ringworld_output_boost (00_scripted_triggers.txt:605) is vanilla's wrapper; a segment is in the system's planet list, so every_system_planet = { limit = { is_ringworld = yes } } finds exactly the segments. The SYSTEM answer is the star flag ring_world_built - and vanilla's own habitat, orbital ring and cosmogenesis world all refuse a system that has it, so a mod that adds a ring world to a system should set it.",
    "To make a segment colonisable, change the CLASS - that is the only field involved. pc_ringworld_habitable has colonizable = yes + district_set = ring_world + starting_district = district_rw_city; every other ring class is the same object with colonizable = no. pc_shattered_ring_habitable is the Shattered Ring's variant (colonizable = yes, district_set = shattered_ring_world, planet_size = 25), which is what its origin uses as starting_colony. A mod's own ring class needs ringworld = yes, a segment entity, fixed_entity_scale = yes, orbit_lines = no and its own district_set.",
    "A RUINED ring is two different objects, and a mod should choose deliberately. ring_world_ruined is a megastructure (drawn as a full broken ring mesh, entity = \"ringworld_destroyed_entity\"), spawned from an initializer's init_effect; a damaged SEGMENT is a planet class (pc_ringworld_*_damaged) that a planet-killer swaps in with change_pc. The Shattered Ring uses both at once: two ruined megastructure arcs plus three damaged planet segments.",
    "ringworld = yes is the class flag, ring_world_built is the system flag, and they are read by different scopes. is_ringworld is a planet trigger; has_star_flag = ring_world_built is what a megastructure's possible block tests. A mod that sets only one of them has a ring that either does not answer planet triggers or does not stop a second ring being built."
]

breaks = [
    "\"The ring is a megastructure, so I edit the megastructure to change the ring.\" The megastructure is deleted by its own completion effect (00_ring_world.txt:349 remove_megastructure = fromfrom) and the segments are planets that did not exist while it did. Every visual decision a mod wants - the radius, the count, which arc, colonisability - is on the INITIALIZER or the PLANET CLASS.",
    "\"The ring world uses one big mesh I can override.\" The intact ring has no single mesh: 12 planet objects each draw a 30-degree arc, and the two full-ring meshes in the install belong to ring_world_ruined / the megastructure preview. There is no gfx/worldgfx/ring_world.txt - the one ring-named file in gfx/worldgfx/ is the species-customisation camera pose (customization_view_ringworld). To change how an intact ring looks, re-skin or replace the PER-SEGMENT meshes / entities - which is the same .mesh-is-pdxasset, override-the-pdxmesh recipe the animated-portrait-route topic records, applied twelve times.",
    "Reading the ring's orbit_angle values as meaningful geometry. They are not: 41 of 50 vanilla ring blocks write 30, and a mod that writes 0/30/60/... has not changed anything about where the segments land. If a mod needs a specific segment at a specific place, the field that is USED for that is orbit_angle_offset on a spawn_planet from the ring's own quadrant - not the initializer's orbit_angle.",
    "A reader that stops at the first non-ring class, or that reads only depth-1 planet blocks. The Cybrex ring's first FOUR segments are inside its STAR body (crisis_initializers.txt:377) and the other eight are top-level; the machine Fallen Empire's ring is 9 segments plus one ruined megastructure section, not 12 planets. A naive walk reports 8 of 12, or calls a 9-segment ring complete, and neither number is a defect in the content.",
    "**A reader that requires class = pc_ringworld_* to see a ring at all.** cybrex_system (prescripted_species_systems.txt:1928) and ring_world_init_01 (utopia_initializers.txt:819) are ring-world systems with ZERO ring planets - four ring_world_ruined megastructure sections and nothing else. The reliable system-level marker across all nine cases is the ring_world_ruined megastructure spawn; ring_world_built covers seven of the nine.",
    "class = star treated as a planet class name. It is an initializer KEYWORD (example.txt:73, *\"Picks a star class which matches the system's class\"*), and there is no star class in common/planet_classes/**. A ring-world reader that reports it produces a phantom finding on every ring system in the game; the same holds for random_planet / random_asteroid.",
    "Trusting parseParadox on a planet class. Every ring class carries atmosphere_color = hsv { ... } (00_planet_classes.txt:1381 and twelve relatives), a scalar block value that ends the enclosing block early in that parser, so fields after it - colonizable, orbit_lines, district_set - read as file-level roots. The ring reader in src/lib/colonization.mjs walks braces itself / uses parseParadoxTree for exactly this reason.",
    "Expecting the transition to be logged. The engine logs no successful render and, measured, no ring-world event either: the 2026-10-06 error.log has 0 ring matches and six Failed to create system light lines. A mod author debugging \"my ring did not appear\" has no log line to grep for - which is why the radius and the segment classes are worth checking in the FILE, which is what the two rules do.",
    "Assuming the ring's segments are at the radius you wrote on them. The radius is the chain's change_orbit; a segment's own orbit_distance is RELATIVE to the previous body (the star-slots topic measures the rule) and most vanilla segments write 0. A mod that writes a positive orbit_distance on every segment thinking it is \"the ring's radius\" gets 12 segments at 12 different radii, each one a ring of one arc."
]

