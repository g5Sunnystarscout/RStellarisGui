body = """
## The verdict in one paragraph\n\n**槽位 1 决定一切。** This round is the first time this project put a **black hole in the PRIMARY\nstar slot** of an empire's home system and then looked at the screen. The star class is the slot\ntable (`00_star_classes.txt:6`), slot 1 is the primary, and the primary is what `is_primary_star`\nresolves to - so slot 1 decides four separate things at once, and the round measured all four:\n\n| what slot 1 decides | why (file-side) | what was seen on screen |\n| --- | --- | --- |\n| **the starbase anchor** | every outpost's `potential_construction` demands `is_primary_star = yes` (`common/ship_sizes/00_starbases.txt:86-92`, 10 sites) | the home starbase sits on the **black hole** |\n| **the galaxy-map icon** | the class declares **no** `icon`; the engine's own format string is `gfx/map/star_classes/%s.dds` | the galaxy map shows a **black-hole system**, not a blank |\n| **the lighting source** | `class = black_hole` selects `gfx/worldgfx/star_black_hole.txt`, whose `system_light = \"black_hole_light\"` (`:82`) is colour (1,1,1) at **intensity 2.5** (`gfx/lights/star_lights.asset:231/239`) | the system is **LIT** and the colonisable world is **bright**, not black |\n| **every body's orbit centre** | a body's `orbit_distance` is a RADIUS from the system centre, and the centre is the primary | the world placed **between** the two stars still **orbits the black hole** |\n\nTwo more on-screen results belong to the same picture. The second star is **yellow but slightly\ndimmer** than a lone G-class star, and the whole view is **slightly dim/tinted** - which is the\nblack-hole class' colour correction (`gfx/worldgfx/star_black_hole.txt:12` `color_lut =\ncolorcorrection_black_hole.tga`, `:19` `galaxy_background_hsv_shift = { -0.42 -0.5 -0.85 }`), not a\ndefect. And a black hole primary with a second star at all is a pairing with **ZERO vanilla\nprecedent**: none of the install's 36 star classes pairs `pc_black_hole` with a companion (vanilla's\n`sc_black_hole` is one slot), so before this round the honest statement was \"untested\"; it is now\n\"possible, and it renders\".\n\n**The design consequence, stated once and plainly: if an origin wants its habitable world to appear\nto orbit the YELLOW star, the yellow star must be slot 1 and the black hole slot 2.** Slot 1 is the\nstarbase anchor, the galaxy icon, the light and the orbit centre; there is no per-body alternative.\n\n## What slot 1 decides\n\n**One slot, four decisions, no override.** The primary star is not just the first body in a list:\nit is the body every primary-only mechanism resolves to, and this round showed the consequences on\nscreen for all four:\n\n1. **The starbase anchor.** `potential_construction = { is_scope_type = planet  is_primary_star = yes\n   NOT = { exists = orbital_defence } }` appears on every outpost in `00_starbases.txt` (10 sites),\n   so a starbase cannot be built anywhere but the primary - and with a black hole in slot 1 the\n   player's home starbase **orbits the black hole**. The install's own localisation states the gate\n   twice: `CAN_BUILD_STATION_STARBASE_NOT_PRIMARY_STAR:0 \"Starbases can only be built around the\n   primary star.\"` (`main_1_l_english.yml:1958`).\n2. **The galaxy-map icon.** Because `sc_accretion` declares no `icon`, the galaxy map has to fall\n   back, and what it showed was a **black-hole system**. Both candidate fallbacks in this\n   configuration are black-hole-valued (the star class' `class = black_hole` matches\n   `gfx/map/star_classes/black_hole.dds`, and the primary body `pc_black_hole` carries\n   `icon = GFX_planet_type_black_hole`), so **this experiment cannot say which one the engine used** -\n   see `## 待确认`.\n3. **The lighting source.** `class = black_hole` resolves to `gfx/worldgfx/star_black_hole.txt`, whose\n   `system_light = \"black_hole_light\"` is an invisible light **at the system centre** - i.e. inside the\n   black hole. So a black hole lights its system **like a star**; there is nothing to work around and\n   no emissive shader is needed for a body in such a system.\n4. **Every body's orbit centre.** A body's `orbit_distance` is a radius from the system centre, and\n   the visual orbit is drawn around the **primary**. A world placed between two stars therefore\n   orbits the primary - \"between the stars\" is a RADIUS, not a shared barycentric orbit.\n\n## 待确认\n\n- **IMPLEMENTED since this was written: the `system_light` check is now the rule\n  `system-light-undefined` (error).** This project's `src/lib/worldgfx.mjs` indexes every\n  `light = { name = \"<x>\" ... }` under `gfx/lights/**` and every `system_light = \"<name>\"` under\n  `gfx/worldgfx/*.txt`, and reports each name with no match, naming the file, the line and the\n  light. It needs NO star-class resolution, for the reason recorded here (the six failures fired at\n  load, before any galaxy existed). Verified against the same measurement this section was written\n  from: the enabled Workshop mod `ugc_2409209888` reports exactly its six unmatched names\n  (`black_star`, `d_class_star`, `dark_star`, `ehof_white_hole_light`, `l_class_star`,\n  `o_class_star`), its `black_hole_light` is NOT reported (the within-mod control), and the install\n  itself is clean - 29 lights defined across its four `gfx/lights/*.asset` files and all 21 of its\n  `system_light` lines resolved. **Still unmeasured even now:** whether a failed system light leaves\n  the system UNLIT or falls back to another light (nobody looked at such a system), and whether the\n  engine logs the same line when the light is defined LATER in the load order. The severity is\n  `error` because the engine names the light itself, at load, one line per distinct name.\n- **Which of the two black-hole-valued fallbacks produced the galaxy-map icon.** With no `icon` on\n  `sc_accretion`, both the star class' `class = black_hole` (matching\n  `gfx/map/star_classes/black_hole.dds`) and the primary body's `pc_black_hole`\n  (`icon = GFX_planet_type_black_hole`) are black-hole-valued, so the screen cannot tell them apart.\n  The experiment that would separate them is a class whose `class` and whose slot-1 planet class\n  disagree in icon - e.g. `class = g_star` with slot 1 `pc_black_hole`, or an explicit\n  `icon = e_binary_star` on this class - and it was not run.\n- **How strong the black-hole tint is, and whether it is acceptable on a colonisable world.** The\n  user reported \"slightly dim\"; no measurement of the colour shift was possible, because the engine\n  offers no read-out and the round produced no screenshots for pixel comparison.\n- **Whether the second star is dimmer because of its own class, the black-hole LUT, or the second\n  slot's lighting.** The second star is `pc_g_star` (yellow) and was reported \"黄色但稍微偏暗\"; the\n  black-hole class' `system_back_light_diffuse` / `cam_light_*` and the colour LUT both act on the\n  whole view, so the cause is not isolated by this run.\n- **Whether the system view's default camera focus lands on the black hole or on the colony.** The\n  user did not report it, and no log line records it.\n- **Whether the colony panel behaves normally.** The capital is vanilla `pc_continental` in an\n  ordinary planet slot reached by `starting_planet = yes`, and `check-consistency.mjs` verified its\n  class is colonisable with a `district_set`, but the round did not collect a colony-panel\n  observation.\n- **Whether `is_environmental_hazard = yes` on a HOME system changes anything beyond its two ship\n  modifiers** (`ship_disengage_chance_reduction = 0.5`, `ship_emergency_ftl_min_days_mult = 0.5`).\n  The class carries it (copied from vanilla `sc_black_hole`), no log line mentions it, and the user\n  did not report a hazard warning on the capital.\n- **Whether a colonisable class in a SECONDARY star slot behaves like a colonisable primary.** This\n  round moved the colonisable world OUT of the star slots entirely (it is an ordinary planet block\n  between the stars), so the question the earlier star-slot topic left open is still open.\n- **Whether `orbit_angle` is absolute or cumulative.** Dodged again, not answered: all three bodies\n  are written with `orbit_angle = 0`, so both readings give the same picture.\n- **Whether the engine enforces `min_distance_from_sun` on a class named explicitly in an\n  initializer.** Also dodged rather than answered - the world is at 75, inside the 60-100 band, so\n  the question does not arise. Answering it needs a second origin placing a continental world below\n  60 and seeing whether the colony survives.\n- **Whether a body between two stars is LAID OUT by radius or by declaration order.** The screen\n  says radius here (the world rendered between the stars although it is declared after the star it\n  sits inside), but that is one configuration and one observation, not a general rule about bodies\n  whose declaration order contradicts their radius.
"""

syntax_blocks = [
    "# ---------------------------------------------------------------------------------------\n# THE SHIPPED RECIPE - a binary whose PRIMARY is a black hole, with a colonisable body BETWEEN\n# the stars. <mods>/zz_probe_accretion (15 files; the origin is 吸积盘 / Accretion Disk).\n# ---------------------------------------------------------------------------------------\n\n# (1) THE STAR CLASS IS THE SLOT TABLE. One `planet = { key = ... }` per slot, IN ORDER:\n#     slot 1 = the PRIMARY. common/star_classes/00_star_classes.txt:6 documents the field as\n#     \"ID for the 'planet' class which defines the actual star\".\nsc_accretion = {                                     # zz_accretion_star_classes.txt:40\n\tclass = black_hole                               # :41  the lighting/appearance tag, NOT decoration:\n\t                                                #      it selects gfx/worldgfx/star_black_hole.txt\n\ticon_scale = 2.0\n\tplanet = { key = pc_black_hole }                # :44  slot 1 -> PRIMARY (the black hole)\n\tplanet = { key = pc_g_star }                    # :45  slot 2 -> the yellow companion\n\tspawn_odds = 0                                  # never drawn at random; only the origin uses it\n\tnum_planets = { min = 1 max = 1 }\n\tis_environmental_hazard = yes                   # :50  copied from vanilla sc_black_hole\n\tarkship_picture = \"arkship_black_hole\"\n\tmodifier = { ship_disengage_chance_reduction = 0.5  ship_emergency_ftl_min_days_mult = 0.5 }\n}\n# `icon` is DELIBERATELY omitted, exactly as vanilla `sc_black_hole` omits it and every vanilla\n# `sc_binary_*` sets it - so \"what icon does the galaxy map give this?\" is an observable.\n\n# (2) THE SYSTEM: TWO star bodies FIRST, in slot order, and the planet THIRD, pulled back inward.\naccretion_disk_start = {                             # zz_accretion_initializers.txt:59\n\tname = \"NAME_accretion_disk_system\"\n\tclass = \"sc_accretion\"                           # :61  the SLOT TABLE above\n\tusage = origin\n\tflags = { empire_home_system accretion_system }\n\tinit_effect = { set_star_flag = accretion_system  generate_home_system_resources = yes ... }\n\n\tplanet = { name = \"NAME_accretion_primary\"   class = star  orbit_distance = 0    ... }  # :96\n\tplanet = { name = \"NAME_accretion_companion\" class = star  orbit_distance = 150  ... }  # :112\n\tplanet = {                                                                              # :134\n\t\tname = \"NAME_accretion_homeworld\"\n\t\tclass = \"pc_continental\"                     # an ORDINARY planet slot - NOT a star slot\n\t\torbit_distance = -75                         # :137  <-- negative = pull INWARD of the previous body\n\t\torbit_angle = 0\n\t\tsize = 18\n\t\tstarting_planet = yes                        # :141  the field vanilla origins use for the first colony\n\t}\n}\n\n# (3) THE ARITHMETIC, and why the radius is 75 and not something smaller.\n# example.txt:87 - an `orbit_distance` is \"relative to the previous planet's orbit\", so at top level\n# the values are CUMULATIVE. The negative form is exactly how vanilla places a second star at all:\n# sol_initializers.txt:409 (Alpha Centauri B, `orbit_distance = -35`) and\n# custom_starting_initializers.txt:935 (the titawin binary home system, `-70`).\n#\n#     black hole   0 +   0 =   0\n#     yellow star  0 + 150 = 150\n#     planet     150 + (-75) =  75      <- STRICTLY between the two stars\n#\n# 75 is inside pc_continental's own legal band, min_distance_from_sun = @habitable_min_distance\n# (60, common/scripted_variables/00_scripted_variables.txt:183) and max_distance_from_sun =\n# @habitable_max_distance (100, :184). A smaller radius (30, say) is equally \"between\" and MUCH\n# closer to the black hole - and if the engine enforces min_distance_from_sun even on a class named\n# explicitly in an initializer, the world would be dropped SILENTLY and the origin would have no\n# starting colony at all, hiding the very phenomenon the round is about. The band check is a\n# deliberate dodge of that failure mode, not a coincidence.\n\n# (4) THE SAME SYSTEM WITH THE ROLES SWAPPED - the recipe the design consequence asks for.\n#     This is the shape to use when the habitable world should LOOK like it orbits the yellow star:\nsc_yellow_primary = {\n\tclass = g_star                                   # the lighting/appearance of the PRIMARY\n\tplanet = { key = pc_g_star }                     # slot 1 -> the YELLOW star is now primary\n\tplanet = { key = pc_black_hole }                 # slot 2 -> the black hole is the companion\n\tspawn_odds = 0\n}"
]

evidence = [
    "measured / the USER'S EYES (2026-10-06, the on-screen verdict; the engine never logs rendering, so these are observations and are labelled as such). The user reported, in three messages: 两个星都渲染了。第二颗是黄色但稍微偏暗。恒星基地在黑洞上。星系图里显示为黑洞星系, 地球是亮的。, 在两星之间，轨道显示是绕黑洞旋转. Read back: both stars render; the second is yellow but slightly dimmer; the home starbase sits on the black hole; the galaxy map shows a black-hole system; Earth (the colonisable world) is BRIGHT; it sits between the two stars and its orbit display is around the BLACK HOLE.",
    "vanilla, the black hole IS a light source, which is why the world is bright: gfx/lights/star_lights.asset:230-244 defines black_hole_light - name = \"black_hole_light\" (:231), color = { 1.0 1.0 1.0 } (:233-237), intensity = 2.5 (:239), radius = 10000 (:240), falloff = 0 (:241), position = { x = 0 y = -4 z = 0 } (:243). Beside it, g_class_star (:110-136) is the SAME intensity = 2.5 (:129) with radius = 100000 (:130) and a warm color = { 0.9 0.9 0.8 } (:119-123). So the prediction the probe shipped (\"lit, not black\") was a reading of this file, and the screen agreed with it.",
    "vanilla, WHERE the light is attached: gfx/worldgfx/star_black_hole.txt:5 world = black_hole, :82 system_light=\"black_hole_light\". The same file is what tints the view - :12 color_lut = \"gfx/worldgfx/colorcorrection_black_hole.tga\", :19 galaxy_background_hsv_shift = { -0.42 -0.5 -0.85 }, :29 system_back_light_diffuse = hsv { 0.58 0.5 0.4 }, :37 cam_light_1_diffuse = hsv { 0.12 0.2 0.0} commented *\"Yellow Key light\"*, :13 environment_map = \"gfx/worldgfx/cubemap_filtered_ldr_yellow.dds\". A class = black_hole star class therefore applies a colour LUT and a background hue shift to the WHOLE system view - which is the \"slightly dim/tinted\" the user saw, and it is the class doing its documented job.",
    "vanilla, the starbase gate: common/ship_sizes/00_starbases.txt:86-92 potential_construction = { is_scope_type = planet  is_primary_star = yes  NOT = { exists = orbital_defence } }, at 10 sites (:88, :543, :593, :644, :697, :748, :799, :856, :911, :996).",
    "vanilla, the band the probe dodged: common/scripted_variables/00_scripted_variables.txt:183 @habitable_min_distance = 60 and :184 @habitable_max_distance = 100, which pc_continental carries as min_distance_from_sun / max_distance_from_sun.",
    "measured, the two files that were shipped and launched: zz_accretion_star_classes.txt:40-57 (sc_accretion, class = black_hole, slot 1 pc_black_hole, slot 2 pc_g_star, spawn_odds = 0, icon absent) and zz_accretion_initializers.txt:59-153 (accretion_disk_start, the two class = star bodies at :96/:112 before the world at :134, orbit_distance = -75 at :137, starting_planet = yes at :141). The origin that names it is common/governments/civics/zz_accretion_origins.txt - origins live under common/governments/civics/**, and the initializer is matched by usage = origin (zz_accretion_initializers.txt:63).",
    "vanilla, the relative-orbit arithmetic is the install's own: example.txt:87 - *\"orbit_distance - Distance from the center of the system, relative to the previous planet's orbit\"* - and the negative form is what places a second star at all in sol_initializers.txt:409 (orbit_distance = -35) and custom_starting_initializers.txt:935 (-70).",
    "measured / log, the launch itself: the run's error.log contained 5 lines naming this mod, and all 5 came from deliberately malformed control files shipped in the same mod (a bad localisation line, an unknown field in a common/planet_classes/ file, and a pdxmesh that exists nowhere) - while zero** lines named sc_accretion, accretion_disk_start, origin_accretion_disk or any of the real files, and neither of the engine's star-class resolver complaints (invalid planet class or random_list, Failed to find star class or valid random_list by key:) appeared. The mod's own checker (check-consistency.mjs, 45 checks / 0 failed) and this project's analyseColonizationFiles (2 slots, 0 findings) also ran clean.",
    "measured / log, three loader facts this round established in passing, all from the controls: an unknown field under common/planet_classes/ is a hard parse error** naming file and line (persistent.cpp:41, \"Unexpected token\"); a class' entity is validated at LOAD and a body in a non-star slot has _xx_entity APPENDED to the name it looks for (planet_class.cpp:339, asking for zz_accretion_control_missing_entity_xx_entity); and the pdxmesh name on an entity is validated (pdx_entity.cpp:2648). All three are why the zero-match about the real definitions is evidence rather than silence.",
    "log, the English translation of this mod is INERT on this machine: the identical malformed localisation line was placed in both localisation/english/ and localisation/simp_chinese/, and only the simp_chinese copy produced a reader error. So the user sees 吸积盘, not \"Accretion Disk\". (What is measured is narrower than \"the file is not opened\": the reader reports no errors from the English directory in this language, in either run.)",
    "binary, the galaxy-map icon is a FILE resolved by a format string, not a sprite declared in a .gfx: gfx/map/star_classes/%s.dds (literal at 39679856), and the folder holds 20 .dds - including black_hole.dds (22,000 B, and it is the ONLY small one: the 12 star and binary icons are 87,508 B or 65,664 B, black_hole.dds is 22,000 B) beside x_star.dds and sc_m_giant.dds. Nothing in interface/**/*.gfx declares these names, which is why the engine's own format string is what resolves them.",
    "vanilla, the zero-precedent claim, re-measured: common/star_classes/00_star_classes.txt has 36 star classes and 67 slots, sc_black_hole (:1 block) declares exactly ONE slot (pc_black_hole), and of the 15 binary and 8 trinary classes not one pairs a black hole with a companion - the pairs are drawn from the ordinary star ladder (pc_a_star, pc_b_star, pc_f_star, pc_g_star, pc_k_star, pc_m_star, pc_pulsar, pc_t_star, pc_toxoid_star). This is the pairing the probe put on screen, and it renders.",
    "log + measured, TWO SIDES OF ONE MECHANISM, and a defect class that is checkable from FILES. At 20:58:09 the engine logged exactly six [gamerendering.cpp:1174]: Failed to create system light <name> lines - ehof_white_hole_light, black_star, d_class_star, dark_star, l_class_star, o_class_star - and all six sit AFTER the probe's last control line, so they are load-time lines of OTHER enabled mods, not of this probe. Every one of the six is a system_light value in a gfx/worldgfx/*.txt of the enabled Workshop mod ugc_2409209888 (\"Black Hole\", D:/SteamLibrary/steamapps/workshop/content/281990/2409209888): five of its files name ehof_white_hole_light (star_quasar.txt:88, star_birch_class.txt:88, sc_white_hole.txt:86, sc_ehof_black_hole.txt:86, sc_annihilator.txt:86) and five name the rest, one each (star_black_dwarf.txt:136 black_star, star_dark.txt:139 dark_star, star_d_class.txt:158 d_class_star, star_l_class.txt:147 l_class_star, star_o_class.txt:147 o_class_star). That mod ships no gfx/lights directory at all, and no gfx/lights/**/*.asset in the mod, in the install or in any other installed mod defines a light by any of the six names (searched for name = \"<each>\": zero in the mod, and the install's gfx/lights/star_lights.asset defines only black_hole_light among the names this mod uses). The control is inside the same mod: its star_black_hole.txt:134 names system_light=\"black_hole_light\", which IS defined (gfx/lights/star_lights.asset:231) - and black_hole_light is NOT among the six failures. So a system_light value that resolves to no light is a defect the engine reports BY NAME AT LOAD, while a light it CAN create is never logged. (The six fired during load, before any galaxy existed - game.log puts the session's only galaxy_generator.cpp:4436: Generating World! at 21:02:06 - so the failure follows the worldgfx FILE the engine loads, and whether any star class must actually reference that world tag for the line to appear is not established by this measurement.)"
]

rules = [
    "Slot 1 IS the primary, and the primary decides the starbase anchor, the galaxy-map icon, the lighting source and every body's orbit centre. There is no per-body override for any of the four. Write the star class' planet = { key = ... } blocks in the order you want the roles assigned, and fill them with the initializer's planet = { class = star } blocks in that same order.",
    "To make a habitable world LOOK like it orbits the yellow star, put the yellow star in slot 1 and the black hole in slot 2. With a black hole primary the starbase, the galaxy icon, the light and the orbit centre are all the black hole's; a \"yellow star\" that only holds the companion slot is a companion in every respect.",
    "A black hole LIGHTS its system. black_hole_light is colour (1,1,1) at intensity 2.5 (gfx/lights/star_lights.asset:239), identical to g_class_star (:129), placed at the system centre. So a body in a black-hole system needs no emissive-shader workaround, and a mod should not \"fix\" a black hole's darkness - there is none.",
    "Expect the view to be tinted. class = black_hole applies colorcorrection_black_hole.tga and galaxy_background_hsv_shift = { -0.42 -0.5 -0.85 } to the whole system view (star_black_hole.txt:12/19). A slightly dim, cold scene with a warm rim is the class working as documented, not a rendering defect - and the second star reading slightly dim beside a lone G-class star is the same effect.",
    "A colonisable body BETWEEN two stars is a negative relative orbit_distance on an ORDINARY planet block, declared AFTER both star blocks. Write the star bodies first (they are what consume the star class' slots - interleaving the planet would make the second class = star the third top-level body and can take the wrong slot), then the planet with orbit_distance = -<gap>: black hole 0, yellow star 150, planet 150 - 75 = 75. Keep the radius inside the class' own band (@habitable_min_distance 60 / @habitable_max_distance 100, 00_scripted_variables.txt:183-184): a world put \"between\" at 30 is equally between and may be dropped silently, leaving the origin with no starting colony at all.",
    "There is no barycentric two-star orbit for bodies. The orbit display is around the primary, whatever the second star does, and a body's orbit_distance is a radius from the system centre - so \"the planet is between the two stars\" describes its RADIUS, never a shared orbit.",
    "The galaxy map does not need icon to show something. With sc_accretion declaring no icon at all, the map still showed a black-hole system - so an omitted icon is a fallback, not a blank. If a mod wants a *specific* galaxy icon (a binary icon for a two-star class, say), it must set icon = <name> explicitly; the fallback is whatever the engine derives, and this configuration could not distinguish its two black-hole-valued candidates.",
    "A system_light must name a light that exists, and the engine says so at load when it does not. Every light is a light = { name = \"<x>\" ... } block under gfx/lights/**/*.asset (black_hole_light, gfx/lights/star_lights.asset:231), and every gfx/worldgfx/*.txt names the one it wants (star_black_hole.txt:82; the failing mod's star_dark.txt:139). The engine builds a light for each world gfx it loads and logs Failed to create system light <name> for one it cannot find - so a copied worldgfx file whose system_light was never defined ships a named error into the player's log, and nothing in the install checks either half. Measured: six such lights in one enabled mod, with the same mod's black_hole_light NOT failing as the control."
]

breaks = [
    "\"No vanilla star class pairs a black hole with a companion, so the pairing is untested\" was correct as a caution and WRONG as a limit. Zero precedent in the install means zero precedent - it does not mean the engine refuses. The round put pc_black_hole in slot 1 and pc_g_star in slot 2 of a home system and both stars rendered. A reader who treats \"0 vanilla uses\" as \"unsupported\" will skip a configuration the engine accepts.",
    "Do NOT conclude \"the black hole makes the scene dark, so a body there needs an emissive shader\". This project's earlier star-slot mods needed star_gfx = no plus an emissive shader because a colonisable body was IN the star slot; a body in an ordinary planet slot of a black-hole system is lit by black_hole_light at intensity 2.5 and was observed BRIGHT. The two situations are different, and the fix for one is a defect in the other.",
    "Do not read the tint as a bug and start disabling class = black_hole fields. The LUT and the HSV shift are what make the system look like a black-hole system; removing them removes the identity the star class exists to give.",
    "The engine logs no SUCCESSFUL render - but it DOES log a FAILED system light. Every one of the on-screen facts above - the second star's colour, the brightness of the world, the tint, the starbase's anchor, the galaxy icon, the orbit ring - appears nowhere in the logs; those are the user's eyes, and no log line supports them. What the engine does report is a system light it could not create: [gamerendering.cpp:1174]: Failed to create system light <name>, six lines in this session (ehof_white_hole_light, black_star, d_class_star, dark_star, l_class_star, o_class_star, all from another mod's worldgfx files - see Evidence). It stays SILENT when a light is created, so the absence of a failure line for black_hole_light is consistent with, but not proof of, that light being created. The logs otherwise prove only that this mod loaded and that the resolver complained about nothing (the 5 control lines and the zero real-definition lines). A future round that wants a rendering FACT must look at the screen, or must find a script-visible proxy such as is_primary_star on a scoped body.",
    "A silent log is only evidence when a noisy one was available. The zero-match about the real definitions means something here because the SAME mod shipped three deliberately malformed controls that produced 5 named errors at three different load stages (localisation, script parse, graphics/entity). Without those controls the zero-match would be indistinguishable from \"the mod was never loaded\".",
    "--debug_mode still does not log which origin or star class registered. setup.log enumerates planet classes and static modifiers but not star classes and not origins, so \"the origin registered\" remains an inference from the clean parse and from the user reaching the system."
]

