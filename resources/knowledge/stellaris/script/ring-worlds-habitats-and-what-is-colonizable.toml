    "vanilla, the carrier route, and create_colony's own documentation of its precondition: effects.log:345-358 documents create_ship's field as create_colony = yes/no (default: yes; if yes, will also create the carrier colony,only when ship_size is marked to carry a colony. WARNING: carrier ships with no colony are killed on a daily basis); common/ship_sizes/00_ship_sizes.txt:97-99 documents carries_colony and the class = shipclass_starbase requirement; common/ship_sizes/29_nomads_dlc_ships.txt:113-114 is vanilla's own pairing with the comment # Needs to be a Starbase to have starbase modules and buildings. / # Enables Arkship custom UI., repeated on nine hulls (:114, :235, :364, :496, :620, :751, :885, :1008, :1138). The tenth starbase-class arkship hull, military_arkship_champions_forge (:1261, class = shipclass_starbase at :1269), has no carries_colony and is still listed by the content's own is_arkship_ship scripted trigger (09_scripted_triggers_nomads.txt:168) - so the content's word \"arkship\" and the engine's carrier predicate are different sets. Measured with this round's analyser: exactly 9 ship sizes in the install declare carries_colony, all 9 class = shipclass_starbase, all 9 carrying pc_ark.",
    "vanilla, the transition effects, quoted: common/inline_scripts/megastructures/arkship.txt:48-54 on_build_complete = { create_arkship_effect = { TYPE = $SHIP_SIZE$ OWNER = from LOCATION = fromfrom } remove_megastructure = fromfrom ... }, and common/scripted_effects/nomads_effects.txt:6693-6708 create_arkship_effect is create_fleet = { effect = { set_owner = $OWNER$ create_ship = { name = random random_existing_design = $TYPE$_tier_1 graphical_culture = $TYPE$ } set_location = $LOCATION$ } } - a fleet with a ship in it. The colony is the ship's, not the site's. The relation is documented at scopes.log:398 (carrier - Scopes from a colony to its carrier., output scope planet) and scopes.log:94 (ship - Scopes from a starbase to its station ship or from a colony to its carrier ship.), with the discriminator at triggers.log:3643-3644 (carrier_is_type = planet/ship); effects.log:3080-3084 (transfer_carrier = { source = <source colony/carrier> target = <target carrier> }) is the effect that moves a colony between carriers. colony appears in the supported-scope list of eleven scope links including megastructure (scopes.log:262-264), so colony = { ... } in megastructure scope is accepted script - what it resolves to on a megastructure, which carries no colony, is not established.",
    "measured, the star-slot route, which is how BOTH mods on this machine put a colonisable object where a structure would be. <mods>/dyson_habitat_cluster/common/star_classes/zz_dysonhab_star_classes.txt:8-13 declares sc_dyson_habitat = { class = g_star  planet = { key = pc_dyson_habitat_star }  spawn_odds = 0  num_planets = { min = 3 max = 6 } }, and common/planet_classes/dysonhab_planet_classes.txt:4-44 declares pc_dyson_habitat_star with star = yes, star_gfx = no, colonizable = yes (:36), district_set = habitat (:37), starting_district = district_hab_housing (:38), planet_size = { min = 80 max = 80 } (:34). <mods>/geocentric_origin/common/star_classes/zz_geocentric_star_classes.txt:11-18 does the same for pc_geocentric_earth (common/planet_classes/zz_geocentric_planet_classes.txt:30-62, colonizable = yes at :56), which is the empire's STARTING colony in the star slot. The install has zero colonisable star-slot classes - measured: of vanilla's 70 planet-class blocks, 24 are colonizable = yes, 45 are colonizable = no, 1 is a random_list, and none of the star = yes classes (pc_b_star, pc_protostar, pc_t_star, ...) is colonisable - so this route is a mod technique with no vanilla example.",
    "measured, both mods' clusters are initializer-placed planets, not megastructures: <mods>/dyson_habitat_cluster/common/solar_system_initializers/dysonhab_initializers.txt:13-106 declares planet = { class = star ... }, then planet = { class = pc_habitat size = 12 } (:20-26), four pc_ringworld_habitable size = 25 (:29, :44, :58, :72) alternating with four pc_ringworld_seam size = 1 (:37, :51, :65, :79), then pc_gaia size = 22 plus two ordinary planets - the *same object set vanilla's ring-world megastructure produces*, placed directly. common/scripted_effects/dysonhab_spawn_effects.txt:12-39 spawns four systems around the galactic core with set_spawn_system_batch and hyperlane = no. Neither mod's common/ tree contains a megastructures/ directory at all (measured: 0 files).",
    "measured, what a mod's own colonisable class does and does not get: pc_geocentric_earth, pc_dyson_habitat_star and pc_ark are all colonizable = yes and are read by the engine trigger; none of them is in the hardcoded colonizable_planet scripted trigger. This round's analyser reads all three correctly (colonizable = true, with pc_geocentric_earth/pc_dyson_habitat_star flagged star = true), which is the check that the reader looks INSIDE the class block - the repository's own parseParadox reports colonizable at file scope for these files, because atmosphere_color = hsv { 0.59 0.45 0.95 } (06_planet_classes_nomads.txt:81) is a scalar block value and the parser ends the enclosing block at its closing brace (measured minimal case: pc_x = { atmosphere_color = hsv { 0.5 0.5 0.9 } colonizable = yes } parses to pc_x holding only atmosphere_color). That is a defect in parseParadox, not a dialect rule; the reader in src/lib/colonization.mjs therefore walks braces itself.",
    "measured, this round's analyser over the whole install: 52 .txt files under common/ship_sizes + common/planet_classes, 319 ship-size blocks, 70 planet-class blocks, 9 carrier hulls, 0 findings - vanilla is internally consistent, which is what makes the two rules below safe to ship. And over the two mods: geocentric_origin 2 classes (pc_geocentric_earth colonisable + star, pc_geocentric_sun not), dyson_habitat_cluster 1 class (colonisable + star), 0 carriers, 0 findings.",
    "log, the honest negative: the install's own logs/ is EMPTY, so nothing here comes from there. The engine's script documentation is in the user data directory (%USERPROFILE%/Documents/Paradox Interactive/Stellaris/logs/script_documentation/, dated 2026-10-06) and is where the four effect/trigger/scope quotations above come from. The preserved error.log (same directory) contains no carries_colony / Arkship / colonisation-machinery line - the only colonisation strings in it are ten missing-audio lines for advisor_notification_colonization_progress_* - so the two engine error strings are quoted from the binary, not from a log this machine produced."
]

rules = [
    "A ring world and a habitat are planets, not structures. The class is a planet_class (pc_ringworld_habitable, pc_ringworld_seam, pc_ringworld_tech, pc_habitat), the object is a planet, and the megastructure of the same name is only its construction site. Anything that reads \"the ring world can be colonised and orbital habitats can be colonised\" and concludes that structures can be colonised has the mechanism backwards.",
    "The transition is on_build_complete -> spawn_planet -> remove_megastructure. For a habitat: habitats.txt:249 -> spawn_habitat_effect (federations_event_effects.txt:1902) -> remove_megastructure = fromfrom (:279). For a ring world: 00_ring_world.txt:284 -> three spawn_planet + remove_megastructure = fromfrom (:349). Do not look for a field that turns a megastructure into a colony: there is none, and the site does not survive.",
    "No megastructure field is colonisability-related, and that is a census, not an opinion. 75 distinct top-level keys across 164 type blocks, 0 of them about colonies. If a mod's design needs \"the structure itself is colonisable\", the design is not expressible; re-express it as \"a planet is spawned where the structure is\" (vanilla's cosmogenesis world, ring worlds and habitats all do exactly that).",
    "colonizable = yes on a planet class is the field, read by the engine trigger is_colonizable. colonizable_by_event = yes is the sibling for a class that may only be reached by event (one vanilla use, pc_infested). colonization_tech gates the ordinary route further.",
    "A star class' planet = { key = pc_... } decides what the STAR is, and therefore whether the star slot holds a colonisable body. That is the only route that puts a colonisable object in a slot no planet class would otherwise fill, and it needs no megastructure, no effect and no planet-class file for the system itself.",
    "carries_colony is the other way to make a colony, and it makes the SHIP the colony, not any structure. It needs class = shipclass_starbase on the same ship size; without it the engine refuses with Arkship size %s does not have class = shipclass_starbase. The class it names must be colonisable, or the carrier relation points at nothing the engine will build a colony from.",
    "A mod can define its own colonisable planet class - the engine accepts it, and both mods on this machine ship one that the engine uses as a starting colony. But vanilla's hardcoded colonizable_planet scripted trigger (00_scripted_triggers.txt:521) does not list it: pre-sapient seeding, some anomaly categories and the ring world's own placement guard will not see it. Use is_colonizable (engine) rather than colonizable_planet (vanilla list) in your own script.",
    "district_set is a free-form tag, not a file: # district_set = <string>  # Use any string here, for use in the uses_district_set trigger for easy compatibility (00_planet_classes.txt:35). A mod may name its own.",
    "The nearest achievable thing to \"any space structure is colonisable\" is the star-slot route or a spawn effect at the same location: define a class with colonizable = yes, put it in the slot the structure would occupy (a star class' planet key, a solar_system_initializer planet entry, or a spawn_planet in your own megastructure's on_build_complete). The player then colonises a body that looks like the structure - which is what a \"Dyson habitat you can colonise\" is."
]

breaks = [
    "Assuming a habitat or ring world is a megastructure you can give a colonizable flag to. The megastructure is deleted by its own completion effect; the colony is on a planet that did not exist before it. Editing the megastructure's block can change cost, time, art and which class is spawned - and nothing about being colonisable except that.",
    "Expecting scales_with_planet or is_ruined_orbital_ring to be a foothold. scales_with_planet (9 uses) is geometry - the orbital ring, the arc furnace - and is_ruined_orbital_ring (1 use, 15_orbital_ring.txt:185) is a ruin flag. Neither is about colonies, and the orbital ring's own possible block conversely GUARDS on colonizable_planet = no (17_orbital_arc_furnace.txt:57, :195).",
    "Reading colonizable_planet = yes in a megastructure file as a field of the megastructure. It is the vanilla *scripted trigger* (10 uses in this directory), used inside potential / possible / placement_rules where the scope is the system or a planet - e.g. the ring world refuses to be built in a system that already has one (00_ring_world.txt:64-71). It is a test, not a capability.",
    "Using colonizable_planet in your own script for your own class. It is a hardcoded list of vanilla classes (plus habitable_planet / habitable_structure, which bottom out in is_colonizable), so a mod's own pc_myhab answers false. This is the one place where \"the engine accepts it\" and \"vanilla's own script accepts it\" come apart.",
    "Copying the arkship recipe without class = shipclass_starbase. The hull loads, looks like an ark ship in its own file, and the engine refuses it by name - and if it does carry a colony while not being supposed to, the ship is killed daily (00_ship_sizes.txt:98). This is the defect the carries-colony-without-starbase rule exists for.",
    "Trusting parseParadox on a planet-class file. It ends the enclosing block at a scalar block value's } (atmosphere_color = hsv { ... }), so every field after it - colonizable included - is reported at file scope. Anything built on that parse silently sees a vanilla planet class as not colonisable.",
    "Believing common/megastructures/99_README_MEGASTRUCTURES.txt is the schema. It documents 107 field names as comments; 75 appear in an actual block. A field listed there is not evidence that the engine implements it in this build."
]

