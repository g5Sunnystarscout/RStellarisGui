id = "ring-worlds-habitats-and-what-is-colonizable"

title = "Ring worlds and habitats are PLANETS, not structures - and colonisability has exactly four homes, none of them a megastructure"

category = "script"

summary = "A ring world and a habitat are not space structures after all. The megastructure is only the construction site; `on_build_complete` SPAWNS PLANET OBJECTS of `pc_ringworld_habitable` / `pc_ringworld_seam` / `pc_ringworld_tech` / `pc_habitat` and then `remove_megastructure`s itself. The census over all 164 `common/megastructures/**` blocks finds 75 distinct top-level keys and NOT ONE is colonisability-related, so no megastructure field can make a structure colonisable. Colonisability lives in exactly four places: `colonizable = yes` on a planet class (read by the engine trigger `is_colonizable`), `colonizable_by_event = yes` for a class reached only by event, a STAR CLASS whose `planet = { key = pc_... }` names a colonisable class (the route both of this machine's mods use, and which NO vanilla class uses), and `carries_colony = <planet_class>` on a ship size with `class = shipclass_starbase` - which makes the hull itself the colony, not the structure."

file_types = [
    ".txt"
]

tags = [
    "planet_classes",
    "megastructures",
    "colonizable",
    "is_colonizable",
    "carries_colony",
    "colony_carrier",
    "habitat",
    "ringworld",
    "star_classes",
    "spawn_planet",
    "census",
    "mod-recipe",
    "measured-negative"
]

body = """
## The verdict in one paragraph\n\n**环世界和轨道居住站是天体（行星对象），不是太空建筑。** The megastructure block of the same name is\nthe **construction site**, and it stops existing: `on_build_complete` runs `spawn_planet` for each\nhabitable section (and each seam) and then `remove_megastructure`. Every colonisable capability the\nplayer sees afterwards - districts, zones, pops, the colonise button - belongs to a **planet object**\nwith a `planet_class` that says `colonizable = yes`, `district_set = ring_world|habitat`, and so on.\nThe megastructure contributes **art, cost, build time and the spawn effect**, nothing else.\n\nAnd the second half of the question: **no, an arbitrary space structure cannot be made colonisable**,\nbecause a `megastructure` has no colonisability field to set. The census below is the proof: 164\nmegastructure type blocks, 75 distinct top-level keys, **0** of them colonisability-related. What a\nmod CAN do is the thing both of this machine's mods actually did - put a **planet** with a\ncolonisable class where you want the colony to be, including in the **star slot** of a system, which\nis how a mod builds \"a Dyson sphere you can colonise\" without a megastructure at all.\n\n## 待确认\n\n- **Whether a `megastructure` can carry a colony at all.** The engine's scope list says `colony` is supported *from* a megastructure (`scopes.log:262-264`), which is either the generic scope walker or a real relation; no script in the install reads a colony through a megastructure, and the two megastructures that \"become\" colonies (habitat, cosmogenesis world) do it by spawning a planet and deleting themselves. Settling it needs a run and a probe, and this round was read-only and launched no game.\n- **Whether a `carries_colony` hull whose class is NOT `pc_ark` gets the arkship UI.** The engine's own switch is the carrier relation - the scope documentation describes the relation itself (`scopes.log:398`, `scopes.log:94`) and `pc_ark` occurs 0 times in `stellaris.exe` - so the reading is \"any colonisable class\"; a mod hull with `carries_colony = pc_myhab` is the only thing that would settle it. This round recorded the two sides (9/9 vanilla hulls use `pc_ark`) and the analyser accepts any class.\n- **What `colonizable = no` does on a class that a star class names.** `pc_geocentric_sun` and the vanilla star-slot classes are that case and exist in game; whether the star slot body is colonisable-but-barred or simply not a colonisation candidate was not observed, and the mod's own `pc_dyson_habitat_star` sets it to `yes` in a slot vanilla never uses for that.\n- **Whether the engine validates a star class' `planet = { key = ... }` against colonisability at load.** No `error.log` line on this machine names a star class or a planet-class key, and a deliberately invalid `key` was not probed, so \"the engine accepts any class here\" rests on the mods that shipped and run.\n- **What `colonizable_by_event` actually changes.** One vanilla use (`pc_infested`, `00_planet_classes.txt:947`), self-documented as `# Ensure colonization mechanics are handled even if the planet cannot be colonized the usual way`. Which mechanics (the colonise order? the AI? the resettlement target list?) was not established, and this project's analyser treats it as \"acceptable carrier target\" on that comment alone.\n- **The complete list of BUILDINGS/districts a custom `district_set` needs.** `district_set = <string>` is free-form and `uses_district_set` reads it, but a habitat district set that renders a district grid needs `common/districts/**` and `common/zones/**` entries whose correspondence to the tag was not measured in this round.\n- **Whether any of this is checkable at run time without launching the game.** The two rules added here are static (file parse + block comparison). A rule of the form \"this colonisable class is actually reachable\" is not: reachability depends on the initializer, the effect and the load order together.
"""

syntax_blocks = [
    "# ---------------------------------------------------------------------------------------\n# 1. THE SPLIT. A ring world is FOUR planet objects spawned by a megastructure stage that\n#    then deletes itself. common/megastructures/00_ring_world.txt\n# ---------------------------------------------------------------------------------------\nring_world_3_intermediate = {                 # :245 - the last construction stage\n\tbuild_time = 3600\n\tupgrade_from = { ring_world_2 }            # :276\n\ton_build_complete = {                      # :284\n\t\tspawn_planet = {                       # :290  the SEAM section, NOT colonisable\n\t\t\tclass = \"pc_ringworld_tech\"        #        colonizable = no (:1457)\n\t\t\tlocation = fromfrom\n\t\t\tinit_effect = {\n\t\t\t\tset_name = \"NAME_Ring_Section\"\n\t\t\t\tset_planet_entity = { entity = \"ringworld_tech_entity_01_entity\" graphical_culture = fromfrom }\n\t\t\t\tset_surveyed = { surveyed = yes surveyor = FROM }\n\t\t\t\tset_all_comms_surveyed = yes\n\t\t\t\tset_carrier_flag = megastructure\n\t\t\t}\n\t\t}\n\t\tspawn_planet = {                       # :308  a SEAM\n\t\t\tclass = \"pc_ringworld_seam\"        #        colonizable = no (:1508)\n\t\t\t...\n\t\t}\n\t\tspawn_planet = {                       # :325  THE HABITABLE SECTION\n\t\t\tclass = \"pc_ringworld_habitable\"   #        colonizable = yes (:1391), district_set = ring_world (:1392)\n\t\t\tlocation = fromfrom\n\t\t\torbit_angle_offset = -30\n\t\t\tinit_effect = {\n\t\t\t\tset_name = \"NAME_Habitable_Section_A\"\n\t\t\t\tset_planet_entity = { entity = \"ringworld_habitable_entity_01_entity\" graphical_culture = fromfrom }\n\t\t\t\tset_surveyed = { surveyed = yes surveyor = FROM }\n\t\t\t\tset_all_comms_surveyed = yes\n\t\t\t\tclear_blockers = yes\n\t\t\t\tsave_event_target_as = ring_section\n\t\t\t\ttrigger_megastructure_icon = yes\n\t\t\t\tset_carrier_flag = megastructure\n\t\t\t}\n\t\t}\n\t\tfromfrom.planet = { set_carrier_flag = has_megastructure }   # :346\n\t\tremove_megastructure = fromfrom                             # :349  THE SITE IS GONE\n\t\tif = { limit = { NOT = { has_star_flag = ring_section_1 } } ... }   # :350-383\n\t}                                                                    # A/B/C/D by star flag\n}\n\n# The FIRST stage does not spawn a planet at all - it removes every planet in the system and\n# spawns four `ring_world_2` megastructure segments (still construction):\nring_world_2_intermediate = {                 # :143\n\ton_build_complete = {                      # :183\n\t\tevery_system_planet = { limit = { is_star = no } remove_planet = yes }   # :184-187\n\t\tset_asteroid_belt = { radius = 0 }                                        # :188\n\t\tremove_megastructure = fromfrom                                           # :192\n\t\tspawn_megastructure = { name = \"NAME_Ring_Section_A\" type = \"ring_world_2\" orbit_angle = 0 ... }  # :193\n\t\t# ... B, C, D at orbit_angle 90 / 180 / 270                                # :202, :211, :220\n\t}\n}\n\n# ---------------------------------------------------------------------------------------\n# 2. THE HABITAT, the same shape through a scripted effect.\n#    common/megastructures/habitats.txt:249 (`habitat_central_complex.on_build_complete`)\n#    calls common/scripted_effects/federations_event_effects.txt:1902 `spawn_habitat_effect`.\n# ---------------------------------------------------------------------------------------\nspawn_habitat_effect = {                       # federations_event_effects.txt:1902\n\tspawn_planet = {\n\t\tclass = \"pc_habitat\"                   # colonizable = yes (00_planet_classes.txt:1604)\n\t\tlocation = $TARGET_PLANET$             # district_set = habitat (:1605)\n\t\torbit_location = yes\n\t\torbit_angle_offset = 135\n\t\torbit_distance_offset = $DISTANCE$\n\t\tsize = 6\n\t\thas_ring = no\n\t\tinit_effect = {\n\t\t\tset_name = { key = HABITAT_PLANET_NAME variable_string = \"\\\\[prev.solar_system.GetName]\" }\n\t\t\tset_planet_entity = { entity = \"habitat_phase_03_entity\" graphical_culture = $HABITAT_OWNER$ }\n\t\t\tset_surveyed = { surveyed = yes surveyor = FROM }\n\t\t\tset_all_comms_surveyed = yes\n\t\t\tclear_blockers = yes\n\t\t\tset_carrier_flag = megastructure\n\t\t\tset_carrier_flag = habitat\n\t\t\tset_carrier_flag = habitat_level_1\n\t\t\tsave_event_target_as = target_habitat\n\t\t\t$TARGET_PLANET$ = { set_carrier_flag = habitat@PREV }\n\t\t}\n\t}\n}\n# and the site then deletes itself, in the megastructure's own block\n# (habitats.txt:279 `remove_megastructure = fromfrom`, :280 a `megastructures.10` event).\n\n# ---------------------------------------------------------------------------------------\n# 3. THE MEGASTRUCTURE FIELD VOCABULARY - all 75 distinct top-level keys of all 164\n#    `common/megastructures/**` type blocks, by number of definitions that carry it.\n#    THE POINT: there is no colonizable, no colonisable, no colony, no planet_class here.\n#    A megastructure cannot BE a colony; it can only SPAWN one as a planet.\n# ---------------------------------------------------------------------------------------\n# 161 entity                         14 plane_offset                  5 overclock_types\n# 149 portrait                       14 station_modifier              5 cycle_desc\n# 134 construction_entity            13 dismantle_possible            5 cycle_icon\n# 119 place_entity_on_planet_plane   13 dismantle_time                5 cycle_length_in_days\n# 113 build_time                     13 on_dismantle_complete         5 cycle_title\n# 111 resources                      11 dismantle_cost                5 on_cycle_complete\n# 109 on_build_complete               9 scales_with_planet            4 hide_name\n# 107 entity_offset                   8 build_type                    4 scripted_action\n#  92 upgrade_from                     8 victory_score                 4 ship_modifier\n#  91 potential                        6 construction_scale            3 hyperlane_range\n#  65 prerequisites                    5 cycle_desc (see above)        3 inline_script\n#  64 possible                         3 sensor_range                  3 outliner_trigger\n#  64 show_in_outliner                 3 starbase                      3 tooltip_best_systems_header\n#  58 country_modifier                 3 tooltip_system_filter         2 build_system_tooltip\n#  57 on_build_start                   2 context_menu_potential        2 tooltip_system_score\n#  44 on_build_cancel                  2 tooltip_system_score_high_threshold\n#  43 show_galactic_map_icon           2 tooltip_system_score_low_threshold\n#  39 construction_blocks_and_blocked_by  2 triggered_country_modifier\n#  35 ai_weight                        2 upgrade_desc\n#  27 placement_rules                  1 build_megastructure_no_cost_localization_key\n#  18 custom_tooltip_requirements      1 build_menu_potential\n#  17 rotate_to_center                 1 build_outside_gravity_well\n#  17 scale_offset                     1 can_be_dismantled_by_non_owner\n#  16 use_planet_resource              1 is_grand_archive\n#  15 bypass_type                      1 is_ruined_orbital_ring\n#  15 show_prereqs                     1 is_shroud_seal\n#  14 dismantle_potential              1 must_select_ship_design\n#  14 plane_offset                     1 on_build_queued / on_build_unqueued / order_icon\n#  14 station_modifier                 1 overlord_can_upgrade / prereq_name\n#                                      1 should_ai_dismantle / tooltip_show_star_resources\n#\n# `common/megastructures/99_README_MEGASTRUCTURES.txt` documents 107 field names as comments. It\n# is a superset of what the install USES, not a schema: 75 of them appear in an actual block, and\n# the 8 `spawn_planet` calls (7 in megastructure `on_build_complete` blocks + 2 in habitats.txt)\n# are the ONLY place a colony-producing object is created from a megastructure.\n\n# ---------------------------------------------------------------------------------------\n# 4. THE FOUR HOMES OF \"COLONISABLE\". There is no fifth.\n# ---------------------------------------------------------------------------------------\n# (a) THE ORDINARY ROUTE - a planet class with `colonizable = yes`.\n#     common/planet_classes/00_planet_classes.txt:104 (pc_desert, and 23 more), and the field is\n#     documented at :33 with its gating technology at :34.\npc_habitat = {                                 # :1581\n\thabitat = yes\n\tplanet_size = 6\n\tcolonizable = yes                          # :1604  <-- THIS is what the colonise button reads\n\tdistrict_set = habitat                     # :1605\n\tstarting_district = district_hab_housing   # :1606\n\thas_colonization_influence_cost = no       # :1610\n\tdefault_planet_selection = yes             # :1614\n\tclimate = \"artificial\"\n\tis_artificial_planet = yes\n}\n\n# (b) THE EVENT ROUTE - `colonizable_by_event = yes`, one use in the whole install.\npc_infested = {                                # :912\n\tcolonizable = no                           # :946\n\tcolonizable_by_event = yes                 # :947  \"Ensure colonization mechanics are handled\n}                                              #        even if the planet cannot be colonized the usual way\"\n\n# (c) THE STAR-SLOT ROUTE - a STAR CLASS names the planet class that IS the star. This is how a\n#     body in the star slot becomes colonisable, and it needs no megastructure and no effect.\nsc_dyson_habitat = {                           # <mods>/dyson_habitat_cluster/common/star_classes/...\n\tclass = g_star                             # lighting/appearance id, not a planet class\n\tplanet = { key = pc_dyson_habitat_star }   # <-- the star body IS this planet class\n\tspawn_odds = 0                             # never drawn at random; only named explicitly\n\tnum_planets = { min = 3 max = 6 }\n}\n# vanilla's own star classes use the same key for their star bodies:\nsc_b = { class = b_star  planet = { key = pc_b_star }  spawn_odds = 10 }   # 00_star_classes.txt:23-27\n# ...and the install documents the key at 00_star_classes.txt:6 -\n# \"ID for the 'planet' class which defines the actual star: its 3D asset, size, colonization setting, etc.\"\n\n# (d) THE CARRIER ROUTE - the hull IS the colony. common/ship_sizes/00_ship_sizes.txt:97-99:\n#     \"# carries_colony = <planet_class>  # default: empty. If filled, ship is able to carry a\n#      # colony of that class and a colony is created by default when the ship is created\n#      # (see create_ship effect for special case). Ships that are not carrying a colony when\n#      # supposed to are killed on a daily basis.\n#      # The ship size must also have \\\"class = shipclass_starbase\\\".\"\ncivilian_arkship_tier_1 = {                    # 29_nomads_dlc_ships.txt:104\n\tclass = shipclass_starbase                 # :113  \"Needs to be a Starbase to have starbase modules and buildings.\"\n\tcarries_colony = pc_ark                    # :114  \"Enables Arkship custom UI.\"\n\tarkship_picture = \"arkship_civilian\"       # :117\n\tplanet_view_header = \"GFX_arkship_planetview_header_civilian\"   # :118\n}\n# The megastructure that PRODUCES that ship is a construction site with no colony at all\n# (common/inline_scripts/megastructures/arkship.txt:48-54):\non_build_complete = {\n\tcreate_arkship_effect = { TYPE = $SHIP_SIZE$ OWNER = from LOCATION = fromfrom }   # create_fleet\n\tremove_megastructure = fromfrom                                                   # + create_ship\n}"
]

evidence = [
    "vanilla, the split, ring world: common/megastructures/00_ring_world.txt ring_world_3_intermediate.on_build_complete (:284) calls spawn_planet three times - class = \"pc_ringworld_tech\" (:291), class = \"pc_ringworld_seam\" (:309), class = \"pc_ringworld_habitable\" (:326) - then remove_megastructure = fromfrom (:349); ring_world_1 (:3) ends its own stage with only set_star_flag = ring_world_built (:138), and ring_world_2_intermediate.on_build_complete (:183) removes every non-star planet in the system (:184-187), zeroes the asteroid belt (:188), deletes itself (:192) and spawns four ring_world_2 segments at orbit angles 0/90/180/270 (:193, :202, :211, :220). The colonisable sections are therefore planet objects that did not exist while the megastructure did.",
