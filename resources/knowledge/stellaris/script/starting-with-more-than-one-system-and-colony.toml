id = "starting-with-more-than-one-system-and-colony"

title = "An empire can start with TWO systems and TWO colonies - the system comes from the initializer tree (`neighbor_system` + `mandatory_neighbors`, and the `distance` block is load-bearing), the colony must come from `on_game_start_country` with population seeded, and ownership is the PRIMARY STARBASE which does not settle in the same tick"

category = "script"

summary = "Measured end to end on Stellaris 4.4.6 with the origin probe <mods>/zz_probe_longroad (长路归乡 / The Long Road Home), and CONFIRMED BY THE USER'S EYES - \"没问题，非常好，两个殖民地，两个恒星系\" (two colonies, two systems). The recipe has three separate parts and each one was measured: (1) the second SYSTEM can only come from the initializer tree, `neighbor_system` + `mandatory_neighbors = yes`, and that block REQUIRES a `distance = { min max }` or the engine logs `prescripted_systems.cpp:795: Mandatory neighbor_system for initializer <x> has min distance 0` and the fallback would place the system at distance 0; (2) the second COLONY cannot come from the initializer at all - no country scope exists during origin galaxy-gen (`01_start_of_game_effects.txt:1` \"before the empire actually exists\"; marker LONGROAD-B-INIT-NO-COUNTRY-SCOPE), so it must come from `on_game_start_country` with population seeded in the Knights-of-the-Toxic-God shape (`create_colony` + `change_colony_foundation_date -360` + `while = { count = 8 create_pop_group = { size = 100 species = ... } }`); (3) ownership is the PRIMARY STARBASE, not the colony (a colony alone leaves the system unowned) and it does NOT settle inside the tick the starbase is created in (vanilla's own comment `federations_initializers.txt:963` \"needs delay for system ownership to settle\"). Also measured: `starting_planet = yes` is IGNORED in a neighbour initializer, the hyperlane between the two systems exists, and name-list renaming reaches the neighbouring system too (北方乐土 / 伊尔巴II logged before `set_name` repaired them). There is NO vanilla precedent for a PLAYER empire starting with two systems - the closest is Imperial Fiefdom, whose three systems belong to a separate AI overlord country created by script."

