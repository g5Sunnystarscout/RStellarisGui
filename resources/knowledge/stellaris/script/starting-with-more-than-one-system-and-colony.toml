body = """
## The verdict in one paragraph\n\n**能做出\"两个殖民地、分处两个星系\"的开局 —— 但必须分三步，而且三步分别属于三个不同的机制。**\nThis round built the origin 长路归乡 / The Long Road Home (`origin_longroad`) in\n`<mods>/zz_probe_longroad`, launched it under `-debug_mode`, measured the markers in the\nengine's own log at 2200.1.1, and then **the user played it and confirmed it**:\n\n> **「没问题，非常好，两个殖民地，两个恒星系」** (no problem, very good - two colonies, two star\n> systems)\n\nThat is **the user's eyes**, which is the strongest evidence this project can get for an\non-screen claim, and it is the grade of the headline result. The three parts, and who does each:\n\n| part | who does it | result | the marker |\n| --- | --- | --- | --- |\n| the second **system** exists | the origin's **initializer**, via `neighbor_system` + `mandatory_neighbors = yes` | **WORKS** | `LONGROAD-INIT-SECOND-SYSTEM-INITEFFECT` |\n| the second **colony** exists | a `on_game_start_country` event: `create_colony` + 8 x 100 pops | **WORKS** (colony count 1 -> 2) | `LONGROAD-C-COLONYCOUNT-BEFORE-1` / `...-AFTER-2` |\n| the second system is **OWNED** | `create_starbase = { owner = root size = starbase_outpost }` | **WORKS** (confirmed on screen) | see `## 待确认` - the log could not settle it in-tick |\n\nand the four things that **do not** work, each measured rather than inferred:\n\n| attempt | result | marker |\n| --- | --- | --- |\n| colonising from inside the origin's initializer | **FAILS** - there is no country scope during origin galaxy-gen | `LONGROAD-B-INIT-NO-COUNTRY-SCOPE` |\n| the engine's `starting_planet = yes` on a body in a **neighbour** initializer | **FAILS** - honoured only in the initializer the empire itself used | `LONGROAD-A-ENGINE-DID-NOT-COLONISE-PROBE-BODY` |\n| a **colony** claiming the system | **NO** - a colony is not ownership | `LONGROAD-OWN-AFTER-COLONY-UNOWNED` |\n| `has_owner` in the same tick as `create_starbase` | **NO** - ownership does not settle in-tick | `LONGROAD-OWN-AFTER-STARBASE-UNOWNED` |\n\n**There is no vanilla precedent for a PLAYER empire starting with two systems.** The closest\nmachinery is Imperial Fiefdom, whose three systems belong to a separate AI overlord country created\nby script (`overlord_initializers.txt:1754`, commented `# Empire second system`), Common Ground /\nHegemony, which hand new systems to AI partners at game start (`origin_events_1.txt:1443-1690`), and\nVoid Dwellers, whose neighbours hold *unowned* guaranteed colonies\n(`federations_initializers.txt:821-830`). Zero precedent is zero precedent, not a refusal - but it\ndoes mean **this recipe has no vanilla example to copy as a whole**, and every part of it had to be\nmeasured separately.\n\n## The three parts, and why each one is where it is\n\n### 1. The second SYSTEM can only come from the initializer tree\n\nAn origin names exactly ONE initializer (`common/governments/civics/00_origins.txt:1922` -\n`origin_void_dwellers -> initializers = { void_dweller_system sol_system_void_dweller_system }`),\nand the list is a **menu, not a batch**: the player picks one in empire creation and nothing runs\nthem all. So the only route from that one initializer to a *different* system is that initializer\nreaching a neighbour - `neighbor_system = { ... }` plus `mandatory_neighbors = yes`, documented in\n`common/solar_system_initializers/example.txt:131-158`:\n\n> *\"If yes, when a suitable neighbor is not found, a new solar system will be created to fulfill it.\n> The distance and angle from the system to the newly created neighbor will be random values between\n> the specified limits.\"*\n\n**The `distance` block is not decoration.** That sentence is the whole reason it is mandatory: the\nfallback has to *place* a new system, and `distance` is the band it places it in. Without the block\nthe minimum is 0, the engine says so by name at load\n(`prescripted_systems.cpp:795: Mandatory neighbor_system for initializer <x> has min distance 0`),\nand the fallback would put the second system on top of the home system. `example.txt:154-157`\ndocuments the field; the probe's own first launch produced the line and the fix silenced it.\n\n**The smallest vanilla example of an origin's initializer reaching a second system** is Void\nDwellers, `federations_initializers.txt:609-611` (`usage = origin`) with `:821-830` - two\n`neighbor_system` blocks, each `trigger`-gated on `num_guaranteed_colonies` and each\n`hyperlane_jumps = { min = 1 max = @jumps }`. Those neighbours hold the *guaranteed colonies* the\nplayer does not own; the shape is the same, the ownership is not.\n\n### 2. The second COLONY cannot come from the initializer - there is no country scope there\n\nThis is the part that decides the architecture. `init_effect` inside an initializer runs before any\ncountry exists, and vanilla says so in its own comment on the file that does the start-of-game work\n(`common/scripted_effects/01_start_of_game_effects.txt:1`):\n\n> *\"This is called in initializers for all standard empires, **before the empire actually exists**\"*\n\nMeasured, not inferred: the probe put a guarded `random_country = { limit = { has_origin = X } }` +\n`create_colony` block inside the origin's second-system `init_effect`, and the guard failed -\n`LONGROAD-B-INIT-NO-COUNTRY-SCOPE`, the `create_colony` behind it never ran. **The same\n`random_country` idiom DOES work in a `misc_system_init` initializer**\n(`federations_initializers.txt:921-938`, the Lost Colony parent, which does\n`random_country = { limit = { has_origin = origin_lost_colony ... } }` then\n`create_colony = { owner = event_target:lost_colony_parent }`) - because that system is generated\n*after* empires exist (`usage = misc_system_init`, `:843`). So the scope is not \"never available\nduring generation\"; it is \"not available inside an ORIGIN initializer\".\n\n**The consequence: any origin that wants a colony outside its home system must do it from\n`on_game_start_country`** (`common/on_actions/00_on_actions.txt:31`), which is where vanilla does\norigin start-up work (`game_start.33` \"populate system with stations\"). And there the colony MUST be\npaired with population - the shape is the Knights of the Toxic God's habitat colony,\n`common/inline_scripts/game_start/origin_toxic_knights.txt:64-78`, reached from\n`01_start_of_game_effects.txt:1657`:\n\n```\ncreate_colony = { owner = event_target:toxic_knights_owner species = event_target:toxic_knights_owner }\nchange_colony_foundation_date = -66112\nwhile = { count = 8 create_pop_group = { size = 100 species = owner_main_species } }\n```\n\n`create_colony` builds the colony OBJECT and nothing else (`effects.log`, scopes `planet ship`), and\na colony with zero population **reverts to a colonisable planet once time runs, with no log line at\nall**. That silence is why this project now checks the pairing (`create-colony-without-pops`, see\n`## Rules`).\n\n### 3. Ownership is the PRIMARY STARBASE, and it does not settle in the same tick\n\nThis is the part that is most often got wrong, and the probe was built to separate its two halves.\nThe engine states the rule about itself, twice:\n\n* `effects.log` - `random_owned_starbase` - *\"Iterate through every owned primary starbase (**i.e.\n  the starbase that claims ownership of a system**)\"*;\n* `triggers.log` - `has_owner` - *\"Checks if the colony carrier is colonized (in colony or carrier\n  scope) **or the system has an owner** (in system scope)\"*.\n\nand the starbase that can do it is the outpost, which can only ever be built at the primary star:\n`common/ship_sizes/00_starbases.txt:86-92` gates every outpost's `potential_construction` on\n`is_primary_star = yes`.\n\n**The experiment: the probe created the colony FIRST, checked `has_owner`, then created the\nstarbase, then checked again.**\n\n* after the colony: `LONGROAD-OWN-AFTER-COLONY-UNOWNED` - **the colony alone does not claim the\n  system**;\n* after `create_starbase` returned with no error: `LONGROAD-OWN-AFTER-STARBASE-UNOWNED` - the\n  ownership had **not settled inside the same tick**.\n\n**Vanilla knows about the second half and wrote it down**, which is what makes it a rule rather\nthan a fluke: `federations_initializers.txt:963` -\n`country_event = { id = game_start.33 days = 1 } # needs delay for system ownership to settle`.\nSo: never test `has_owner` in the same effect block that creates the starbase, and never rely on a\ncolony to give you territory. The user's confirmation (\"两个殖民地，两个恒星系\") is what settles that\nthe outpost *did* work - the in-tick check could only ever show \"not yet\".\n\n## 待确认\n\n- **What the in-tick `has_owner` check could NOT settle, and what the user's eyes settled instead.**\n  The log ended the game-start tick with `LONGROAD-OWN-AFTER-STARBASE-UNOWNED`, so it could not show\n  ownership at all. The deferred re-check (`zz_longroad.4`, planned for 3 and 40 days after start)\n  was added to the mod AFTER that game was launched, so it never ran; the user's confirmation\n  (\"两个殖民地，两个恒星系\") is what closes the question. **A fresh game with `.4` present, or a save\n  read with `tools/inspect-save.mjs`, would give the mechanical proof and neither was done.**\n- **Whether the outpost starbase physically EXISTS, as opposed to `create_starbase` returning\n  without error.** No error line was written and the user reports the systems as two, but \"no error\"\n  is not \"it exists\" and no save was read. This is the cleanest remaining hole.\n- **The pop-group composition of the second colony** (how many groups, what sizes, which jobs). The\n  log proves the effect ASKED for 8 groups of 100; only a save read can confirm what exists.\n- **Whether the `mandatory_neighbors` FALLBACK path was ever exercised.** The probe's galaxy always\n  found a suitable neighbour, so the code path that CREATES a system - the one the `distance` block\n  exists to place - was never taken in a live galaxy. The `distance` requirement is established from\n  the engine's load-time error, not from watching a fallback fire.\n- **Whether sector assignment copes with a second, non-adjacent-by-default system.** The user did\n  not report a sector problem and the round collected no sector observation; the second system is one\n  hyperlane jump from home, which is the case most likely to behave normally.\n- **Whether station construction in the second system follows correctly.** The mod runs its own\n  station pass (`LONGROAD-S-EVENT-STATIONS-DONE`) scoped to the second system, because vanilla's\n  `game_start.33` populates stations only for systems already OWNED when it runs - and the second\n  system is not owned until the outpost settles. Whether the player sees mining/research stations on\n  the second system's uncolonised bodies was not confirmed either way.\n- **Whether other enabled mods interact with a second player system.** The install ran 18 other\n  mods, several adding map modes, country containers and scripted effects; they were not audited.\n  The new system is an ordinary `rl_standard_stars` system, so interaction is unlikely but unproven.\n- **What happens if the outpost creation FAILS** - the failure mode is reasoned about (an unowned\n  system with a colony in it) but was never produced, because the probe's `create_starbase` returned\n  cleanly.\n- **Whether the same recipe works for a system further than one jump away**, or for a second system\n  in a galaxy where no suitable neighbour exists (the fallback path above). Both need a fresh\n  galaxy configuration and neither was run.\n- **Whether the engine logs anything at all when a zero-population colony reverts.** This project\n  measured the revert from a save read in two earlier rounds and has never found a log line for it;\n  \"no line\" is a claim from the searches that were run, which is why the paired rule\n  (`create-colony-without-pops`) says what it searched rather than asserting silence as a fact.
"""

syntax_blocks = [
    "# =========================================================================================\n# THE SHIPPED RECIPE, in three files. <mods>/zz_probe_longroad - the origin is\n# 长路归乡 / The Long Road Home (origin_longroad).\n# =========================================================================================\n\n# -----------------------------------------------------------------------------------------\n# (1) THE SECOND SYSTEM - the origin's initializer tree. This is the ONLY route: an origin\n#     names exactly ONE initializer (`00_origins.txt:1922` for void dwellers), so a second\n#     system can only come from that initializer reaching a NEIGHBOUR.\n#     common/solar_system_initializers/zz_longroad_initializers.txt\n# -----------------------------------------------------------------------------------------\n\nlongroad_home_system = {\n\tname = \"NAME_longroad_home_system\"\n\tclass = \"sc_g\"\n\tusage = origin                       # :63  only an ORIGIN can pick this one\n\tflags = { empire_home_system }\n\n\t# ... the home bodies, one of them `starting_planet = yes` ...\n\n\tneighbor_system = {                  # :225  <-- THE SECOND SYSTEM\n\t\tinitializer = \"longroad_second_system\"\n\t\thyperlane_jumps = { min = 1 max = 1 }\n\t\t# THE `distance` BLOCK IS LOAD-BEARING. Without it the engine logs, at load:\n\t\t#   [prescripted_systems.cpp:795]: Mandatory neighbor_system for initializer\n\t\t#     longroad_home_system has min distance 0\n\t\t# and the `mandatory_neighbors` fallback - which is what CREATES a system when no\n\t\t# suitable neighbour exists - would place it at distance 0 from its parent.\n\t\tdistance = { min = 10 max = 25 }  # :230\n\t}\n\tmandatory_neighbors = yes            # :232  \"a new solar system will be created to fulfill it\"\n}\n\n# The neighbour initializer exists ONLY to be called: no `usage`, so it is never drawn at\n# random (`example.txt:161-172`). `init_effect` here runs in GALACTIC_OBJECT scope\n# (`example.txt:52`), which is why it can set flags and names but CANNOT create a colony.\nlongroad_second_system = {\n\tname = \"NAME_longroad_second_system\"\n\tclass = \"rl_standard_stars\"\n\tinit_effect = {\n\t\tlog = \"LONGROAD-INIT-SECOND-SYSTEM-INITEFFECT\"   # :234  the marker that proves it ran\n\t\tset_star_flag = longroad_second_system\n\t}\n\tplanet = { name = \"NAME_longroad_colony_body\" class = \"pc_continental\" orbit_distance = 30 ... }\n\t# A body flagged `starting_planet = yes` was placed here TOO, on a separate world, as a\n\t# probe. The engine IGNORED it: LONGROAD-A-ENGINE-DID-NOT-COLONISE-PROBE-BODY.\n\tplanet = { name = \"NAME_longroad_probe_body\" class = \"pc_ocean\" starting_planet = yes ... }\n}\n\n# -----------------------------------------------------------------------------------------\n# (2) THE SECOND COLONY - `on_game_start_country`, with population. NOT the initializer.\n#     common/on_actions/zz_longroad_on_actions.txt\n# -----------------------------------------------------------------------------------------\n\non_game_start_country = {               # 00_on_actions.txt:31 - takes an `events` list ONLY\n\tevents = {\n\t\tzz_longroad.1                   # the colony + the outpost\n\t\tzz_longroad.2                   # the name repair\n\t}\n}\n\n# events/zz_longroad_events.txt - `immediate` runs in COUNTRY scope, so `root` is the country.\ncountry_event = {\n\tid = zz_longroad.1\n\thide_window = yes\n\tis_triggered_only = yes\n\ttrigger = { has_origin = origin_longroad }\n\timmediate = {\n\t\t# ... find the second system, log the colony count, check `has_owner` BEFORE touching\n\t\t#     the starbase (that is the experiment that answers \"does a colony claim a system?\") ...\n\n\t\t# 2a. the colony, via the scripted effect below\n\t\tzz_longroad_found_the_colony = yes\n\n\t\t# 2b. the PRIMARY STARBASE, which is what actually claims the system\n\t\tsolar_system = {\n\t\t\tcreate_starbase = {\n\t\t\t\tsize = starbase_outpost\n\t\t\t\towner = root\n\t\t\t}\n\t\t}\n\t\t# NEVER assert `has_owner` here: LONGROAD-OWN-AFTER-STARBASE-UNOWNED.\n\t}\n}\n\n# common/scripted_effects/zz_longroad_effects.txt - the EXACT Knights-of-the-Toxic-God shape\n# (common/inline_scripts/game_start/origin_toxic_knights.txt:64-78).\nzz_longroad_found_the_colony = {\n\t# (in the real file this is scoped to the second system's colony body)\n\tcreate_colony = {                   # effects.log: scopes `planet ship`\n\t\towner = root\n\t\tspecies = root\n\t}\n\tchange_colony_foundation_date = -360\n\twhile = {\n\t\tcount = 8\n\t\tcreate_pop_group = { size = 100 species = root }   # 800 pops in 8 groups\n\t}\n\t# A colony with NO population REVERTS to a colonisable planet, and the engine logs\n\t# NOTHING when it happens - which is why the pop seeding is not optional.\n}\n\n# -----------------------------------------------------------------------------------------\n# (3) THE HYPERLANE is the initializer tree's own (`hyperlane_jumps = { min = 1 max = 1 }`),\n#     so the two systems are one jump apart: LONGROAD-C-REACHABLE-HYPERLANE-YES.\n# -----------------------------------------------------------------------------------------"
]

